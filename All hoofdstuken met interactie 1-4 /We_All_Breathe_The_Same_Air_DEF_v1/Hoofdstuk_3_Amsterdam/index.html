<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><style>html,body{margin:0;background:#000}[hidden]{display:none!important}</style>
<title>Amsterdam Chapter Three</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=Reenie+Beanie&family=Vazirmatn:wght@400;500&display=swap">
<style>
/* Layout: Sam's own chapter film fills the screen (16:9, never cropped). It stops at four moments; the viewer acts on the frozen frame, then the film runs on. Sam's own words are the only story text; UI copy stays small and functional. */
:root{
  --ink:#000; --chalk:#ece8de; --chalk-dim:#a3a59e;
  --ochre:#D6A93E; --ochre-dim:#a8873a; --shade:rgba(0,0,0,.62); --stamp:#c0402c;
  --card:#e9c94a; --card-ink:#2a2412;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Literata",Georgia,serif;
  --f-chalk:"Reenie Beanie","Comic Sans MS",cursive;
  --f-sub:Arial,Helvetica,"Helvetica Neue",sans-serif;
  --f-fa:"Vazirmatn",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--chalk)}
body{overflow:hidden;font-family:var(--f-body)}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
.frame{position:relative;width:min(100vw,calc((100vh - 112px) * 16 / 9));aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#000;margin:44px 0 56px}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.frame video.hide{visibility:hidden}
.ui{position:absolute;inset:0;z-index:4}

.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:20}
.chap{font:500 .75rem var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--chalk-dim)}
.chap b{color:var(--ochre);font-weight:700}
.tools{display:flex;gap:8px}
.ghost{font:700 .78rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--chalk);background:var(--shade);border:1px solid rgba(236,232,222,.35);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.ghost:hover{border-color:var(--ochre);color:var(--ochre)}
.ghost[aria-pressed="true"]{border-color:var(--ochre);color:var(--ochre)}
.btn{font:700 1rem var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:#000;background:var(--chalk);border:0;padding:14px 30px;cursor:pointer}
.btn:hover{background:var(--ochre)}
.btn:focus-visible,.ghost:focus-visible,.hold:focus-visible,.play:focus-visible{outline:2px solid var(--ochre);outline-offset:4px}

/* controls */
.ctl{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.play{width:36px;height:36px;border-radius:50%;border:1px solid rgba(236,232,222,.4);background:var(--shade);color:var(--chalk);cursor:pointer;font-size:.9rem;flex:0 0 auto}
.tl{position:relative;flex:1 1 auto;height:22px;min-width:0}
.tl .rail{position:absolute;left:0;right:0;top:10px;height:2px;background:rgba(236,232,222,.2)}
.tl .fill{position:absolute;left:0;top:10px;height:2px;background:var(--ochre);width:0}
.tl .mk{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--ochre);background:#000;cursor:pointer;padding:0}
.tl .mk.done{background:var(--ochre)}
.tl .mk span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 .62rem var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--chalk-dim);opacity:0;transition:opacity .2s;pointer-events:none}
.tl .mk:hover span,.tl .mk:focus-visible span{opacity:1}
.time{font:600 .78rem var(--f-display);letter-spacing:.12em;color:var(--chalk-dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.cc{flex:0 0 auto;padding:7px 10px}

/* large text: the same words as in the film, bigger */
.big{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;pointer-events:none}
.big span{display:block;width:100%;box-sizing:border-box;padding:1.2% 6% 1.6%;background:rgba(0,0,0,.86);font:700 clamp(1rem,2.6vw,2rem)/1.3 var(--f-sub);color:var(--ochre);text-align:center;text-wrap:balance;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 10px rgba(0,0,0,.95);opacity:0;transition:opacity .25s}
.big span.on{opacity:1}

/* cards */
.card{position:fixed;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:22px;text-align:center;background:#000;padding-inline:16px;transition:opacity 1s}
.card.off{opacity:0;pointer-events:none}
.eyebrow{margin:0;font:500 .85rem var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--ochre-dim)}
.h-title{margin:0;color:var(--ochre);font:800 clamp(2.4rem,8vw,6rem)/.9 var(--f-display);text-transform:uppercase;text-wrap:balance}
.place{margin:0;font-style:italic;color:var(--chalk-dim);font-size:1.1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick{font-size:.7rem}
.endnum{font:600 .9rem var(--f-display);letter-spacing:.2em;color:var(--chalk-dim)}
.endnum b{color:var(--card);font-weight:700}

.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;font:600 .74rem var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--chalk);background:rgba(0,0,0,.85);border:1px solid var(--ochre);padding:9px 14px}
/* touch: no double-tap zoom delay, a clear pressed state, bigger targets on phones */
.phone,.hold,.door,.skip,.btn,.ghost,.shoot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.phone .rc{display:block;margin-top:4px;font-size:.85em;color:var(--ochre)}
@media (pointer:coarse){
  .phone,.hold{width:clamp(104px,22%,150px)}
  .door{width:clamp(150px,26%,230px)}
  .skip{padding:10px 14px;font-size:.72rem}
  .ask{font-size:.72rem;padding:8px 12px}
}
/* interaction chrome */
.ask{position:absolute;left:50%;transform:translateX(-50%);bottom:4%;z-index:7;text-align:center;font:600 clamp(.66rem,1.2vw,.85rem) var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ochre);background:rgba(0,0,0,.65);padding:7px 14px;max-width:92%}
.voice{position:absolute;left:50%;transform:translateX(-50%);bottom:13%;z-index:7;width:min(80%,46ch);text-align:center;pointer-events:none}
.voice p{margin:0;display:inline;font:400 clamp(1rem,2vw,1.5rem)/1.6 var(--f-body);font-style:italic;color:var(--chalk);background:rgba(0,0,0,.72);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 10px;text-shadow:none}
.voice p .w{opacity:0;transition:opacity .5s}
.voice p .w.on{opacity:1}
.voice .fa{direction:rtl;font:400 clamp(.95rem,1.7vw,1.3rem)/1.7 var(--f-fa);font-style:normal;color:var(--chalk-dim);margin-top:6px;opacity:0;transition:opacity 1.2s}
.voice .fa.on{opacity:1}
.skip{position:absolute;right:2%;bottom:4%;z-index:8;font:600 .66rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--chalk-dim);background:rgba(0,0,0,.55);border:1px solid rgba(236,232,222,.25);padding:6px 10px;cursor:pointer}
.skip:hover{color:var(--ochre);border-color:var(--ochre)}
.readout{position:absolute;left:50%;top:76%;transform:translateX(-50%);z-index:7;font:700 clamp(.8rem,1.4vw,1rem) var(--f-display);letter-spacing:.18em;color:var(--chalk);background:rgba(0,0,0,.6);padding:4px 10px;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .4s}
.readout.on{opacity:1}

.vig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 58%,transparent calc(62% - var(--v,0)*50%),#000 calc(96% - var(--v,0)*38%))}
.hold{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:clamp(84px,12%,140px);aspect-ratio:1;border-radius:50%;border:0;background:rgba(0,0,0,.45);cursor:pointer;display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;z-index:5;touch-action:none}
.hold svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold .lbl{font:700 clamp(.6rem,1.1vw,.82rem)/1.2 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--chalk);text-shadow:0 1px 6px #000;text-align:center}
.hold.pulse circle.base{animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.95}}
.stamp{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);z-index:6;font:800 clamp(1.6rem,5vw,3.8rem) var(--f-display);letter-spacing:.08em;color:var(--stamp);border:5px solid var(--stamp);padding:2px 18px;opacity:0;transition:transform .18s cubic-bezier(.3,1.6,.6,1),opacity .1s;pointer-events:none}
.stamp.on{opacity:.95;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.84);z-index:3;opacity:0;transition:opacity 1s}
.dim.on{opacity:1}
.wallbox{position:absolute;top:3%;bottom:3%;left:50%;transform:translateX(-50%);aspect-ratio:1139/1695;z-index:5;box-shadow:0 10px 60px #000;opacity:0;transition:opacity 1.2s;overflow:hidden}
.wallbox.on{opacity:1}
.wallbox img{position:absolute;inset:0;width:100%;height:100%}
.wallbox .lines{position:absolute;inset:0;pointer-events:none}
.wallbox canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.scratch{position:absolute;font:clamp(.8rem,1.5vw,1.3rem)/1 var(--f-chalk);color:rgba(236,232,222,.78);white-space:nowrap;pointer-events:none}
.scratch.mine{color:rgba(255,246,220,.98);font-size:clamp(1rem,2vw,1.7rem);opacity:0;transition:opacity 2.4s}
.scratch.mine.on{opacity:1}
.wallcount{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);z-index:8;font:600 .68rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--chalk-dim);background:rgba(0,0,0,.6);padding:4px 10px;opacity:0;transition:opacity .8s;white-space:nowrap}
.wallcount.on{opacity:1}
.write{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:9;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(92%,520px);background:rgba(0,0,0,.82);padding:12px}
.write p{flex-basis:100%;margin:0;text-align:center;font:600 .72rem var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ochre)}
.write small{flex-basis:100%;text-align:center;font-size:.72rem;color:var(--chalk-dim)}
.write input{flex:1 1 180px;min-width:0;font:1.5rem var(--f-chalk);color:var(--chalk);background:#111;border:1px solid rgba(236,232,222,.35);padding:4px 10px}
.write input:focus{outline:2px solid var(--ochre)}

.finder{position:absolute;inset:6% 22%;z-index:5;pointer-events:none;transition:opacity .4s}
.finder i{position:absolute;width:30px;height:30px;border:2px solid var(--chalk)}
.finder i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.finder i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.finder i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.finder i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.finder span{position:absolute;top:8px;left:40px;font:600 .72rem var(--f-display);letter-spacing:.2em;color:var(--stamp)}
.shoot{position:absolute;inset:0;z-index:6;background:transparent;border:0;cursor:pointer}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:9;pointer-events:none}
.flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.gray video{filter:grayscale(1) brightness(.6);transition:filter .3s}

/* the yellow card (an illustration inside the story, not a real document) */
.ycard{position:absolute;left:50%;top:39%;z-index:8;width:min(46%,420px);aspect-ratio:85.6/54;background:var(--card);color:var(--card-ink);border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.8);
  display:grid;grid-template-columns:34% 1fr;gap:6%;padding:5%;transform:translate(-50%,-50%) rotate(-3deg) scale(.6);opacity:0;transition:transform .8s cubic-bezier(.2,1.2,.4,1),opacity .5s}
.ycard.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
.ycard canvas{width:100%;aspect-ratio:3/4;background:#333;border:2px solid rgba(42,36,18,.5);filter:grayscale(1) contrast(1.1)}
.ycard .info{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.ycard .lab{font:600 clamp(.45rem,.9vw,.65rem) var(--f-display);letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.ycard .name{font:700 clamp(.8rem,1.6vw,1.2rem) var(--f-display);letter-spacing:.06em;text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.ycard .num{white-space:nowrap;font:800 clamp(.95rem,2.4vw,2rem) var(--f-display);letter-spacing:.08em;font-variant-numeric:tabular-nums}

/* the interrogation: what you answer is crossed out */
.answer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;width:min(70%,520px);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.answer label{font:600 .72rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ochre);text-align:center;text-shadow:0 1px 8px #000}
.answer textarea{font:400 clamp(1rem,1.8vw,1.3rem)/1.5 var(--f-body);color:var(--chalk);background:rgba(0,0,0,.82);border:1px solid rgba(236,232,222,.35);padding:10px 12px;resize:none;min-height:4.6em}
.answer textarea:focus{outline:2px solid var(--ochre)}
.answer .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.said{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;width:min(70%,520px);font:400 clamp(1rem,1.8vw,1.3rem)/1.5 var(--f-body);color:var(--chalk);background:rgba(0,0,0,.82);padding:12px 14px;text-align:left;white-space:pre-wrap;word-break:break-word}
.said .c{transition:color .2s}
.said .c.x{text-decoration:line-through;text-decoration-color:var(--stamp);text-decoration-thickness:2px;color:rgba(236,232,222,.35)}
.said.gone{opacity:0;transition:opacity 1.6s}
.turn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:21;display:none;font:600 .7rem var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-dim);background:rgba(0,0,0,.7);border:1px solid rgba(236,232,222,.25);padding:8px 12px;white-space:nowrap}
@media (orientation:portrait) and (max-width:700px){
  .turn{display:block}
  .frame{overflow:visible}
  .big{top:calc(100% + 18px);bottom:auto}
  .big span{background:none;padding:0 4px;font-size:1.15rem}
}
/* chapter two: the door with your number, the note in the locker */
.door{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) perspective(900px) rotateY(0deg);transform-origin:left center;z-index:5;width:clamp(120px,20%,220px);aspect-ratio:3/5;border:0;border-radius:3px;cursor:pointer;
  background:linear-gradient(90deg,#6d5236,#8a6a46 40%,#6a4f33);box-shadow:inset 0 0 0 6px #3a2c1c,0 20px 60px rgba(0,0,0,.8);transition:transform 1.2s cubic-bezier(.5,0,.2,1),opacity 1.2s;padding:0}
.lockclip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:6;opacity:0;transition:opacity .9s;background:#000;pointer-events:none}
.lockclip.on{opacity:1}
.door.open{transform:translate(-50%,-50%) perspective(900px) rotateY(-78deg);opacity:.35}
.door .plate{position:absolute;left:12%;right:12%;top:16%;background:#e9e4d8;color:#222;border:2px solid #555;padding:6% 4%;display:flex;flex-direction:column;align-items:center;gap:2px}
.door .plate small{font:600 clamp(.45rem,.9vw,.62rem) var(--f-display);letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.door .plate b{font:800 clamp(.75rem,1.6vw,1.15rem) var(--f-display);letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.door .knob{position:absolute;right:10%;top:52%;width:9%;aspect-ratio:1;border-radius:50%;background:#c9a74a;box-shadow:0 1px 2px #000}
.door:focus-visible{outline:2px solid var(--ochre);outline-offset:6px}
.note{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-2deg);z-index:7;width:min(56%,420px);background:#efe8d6;color:#2a2418;padding:18px 20px 14px;box-shadow:0 14px 50px rgba(0,0,0,.8);opacity:0;transition:opacity 1.4s}
.note.on{opacity:1}
.note p{margin:0;font:clamp(1.3rem,2.8vw,2.2rem)/1.1 var(--f-chalk);word-break:break-word}
.note small{display:block;margin-top:10px;font:600 .6rem var(--f-display);letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.found{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:7;display:flex;gap:10px;height:62%;opacity:0;transition:opacity 1.4s}
.found.on{opacity:1}
.found img{height:100%;width:auto;border:3px solid #111;box-shadow:0 12px 40px rgba(0,0,0,.8)}
/* mother: the phone that is not answered */
.phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:clamp(90px,13%,150px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(236,232,222,.6);background:rgba(0,0,0,.7);color:var(--chalk);cursor:pointer;display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font:700 clamp(.6rem,1.1vw,.82rem)/1.3 var(--f-display);letter-spacing:.16em;text-transform:uppercase;text-align:center}
.phone.ringing{animation:ringring 1.2s ease-in-out infinite;border-color:var(--ochre)}
@keyframes ringring{0%,100%{box-shadow:0 0 0 0 rgba(214,169,62,.5)}50%{box-shadow:0 0 0 18px rgba(214,169,62,0)}}

@media (max-height:500px) and (orientation:landscape){
  .frame{width:min(100vw,calc((100vh - 80px) * 16 / 9));margin:32px 0 48px}
  .top{top:calc(4px + env(safe-area-inset-top,0px))}
  .top .ghost{padding:5px 9px;font-size:.62rem}
  .chap{font-size:.62rem}
  .ctl{padding-top:4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .play{width:30px;height:30px}
}
@media (max-height:500px),(max-width:640px){ .chap{display:none} #topcomic{display:none} .top{justify-content:flex-end} }
@media (max-width:640px){.chap .long{display:none}.ghost{padding:7px 10px;font-size:.68rem}.tl .mk span{display:none}.ycard{width:62%}}

/* interaction text sits UNDER the film, so it never covers the comic's drawings or lettering.
   Short screens (phones held sideways) have no room below: there it hugs the very bottom edge. */
@media (min-height:601px){
  .frame{width:min(100vw,calc((100vh - 240px) * 16 / 9));margin:44px 0 180px;overflow:visible}
  .ask{top:calc(100% + 12px);bottom:auto;background:none;padding:0;max-width:100%}
  .readout{top:calc(100% + 12px);transform:translateX(-50%);background:none}
  .voice{top:calc(100% + 42px);bottom:auto;width:min(100%,64ch)}
  .skip{top:calc(100% + 8px);bottom:auto;right:0}
}
@media (max-height:600px){
  .frame{width:min(100vw,calc((100vh - 150px) * 16 / 9));margin:32px 0 118px;overflow:visible}
  .ask{top:calc(100% + 4px);bottom:auto;background:none;padding:0;font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 96px)}
  .readout{top:calc(100% + 4px);bottom:auto;background:none;font-size:.7rem}
  .voice{top:calc(100% + 22px);bottom:auto;width:min(100vw - 32px,70ch)}
  .voice p{font-size:.82rem;line-height:1.5}
  .voice .fa{font-size:.78rem;margin-top:2px}
  .skip{top:calc(100% + 2px);bottom:auto;right:0;padding:6px 10px}
}
/* the film sits in the middle of the screen; phones held sideways get the biggest film that still leaves room for the text below */
@media (min-height:601px){ .frame{margin:96px 0 144px} }
@media (orientation:landscape) and (max-height:600px){
  .frame{width:min(100vw - 24px,calc((100vh - 96px) * 16 / 9));margin:34px 0 62px}
}
/* during an interaction the play bar steps aside so the text under the film has the room */
@media (max-width:640px){#fs{display:none!important}}
body.inter .ctl{opacity:0;pointer-events:none;transition:opacity .4s}
/* chapter three */

 [0.2,4.2,"That morning I was summoned for an interview.","Die ochtend werd ik opgeroepen voor een gesprek."],

 [143.29,148.29,"The city kept nourishing me, mind and body.","De stad bleef me voeden, lichaam en geest."],

/* ---------- sounds for the moments (synthesised) ---------- */
const snd=(()=>{
  /* Interaction sounds are real mp3 files played with <audio>, the same way the film plays its sound.
     (Sound made live in the browser is muted by iPhone's silent switch and often blocked; files are not.) */
  const POOL={beat:2,scrape:3,tick:3}, NAMES=["beat","inhale","tick","bell","stamp","exhale","shutter","scrape","ring","pickup","creak","riot","door","flies"], els={}, idx={};
  let beatT=null,bpm=70,ringT=null,riotT=null;
  NAMES.forEach(n=>{ els[n]=[]; for(let i=0;i<(POOL[n]||1);i++){ const a=new Audio(); a.preload="auto"; a.src="sfx/"+n+".mp3"; a.setAttribute("playsinline",""); els[n].push(a); } });
  function play(n){ const list=els[n]; if(!list) return null; idx[n]=((idx[n]||0)+1)%list.length; const a=list[idx[n]];
    try{ a.muted=false; a.volume=1; a.currentTime=0; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} return a; }
  function halt(n){ (els[n]||[]).forEach(a=>{ try{ a.pause(); a.currentTime=0; }catch(e){} }); }
  /* iPhone only lets a sound play by itself after it has been started once inside a tap.
     So on every tap, each sound that is not yet allowed is started silently and stopped again. */
  function wake(){ try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    for(const n in els) els[n].forEach(a=>{ if(a._ok||a._try||!a.paused) return; a._try=true;
      try{ a.muted=true; const p=a.play();
        const done=()=>{ a._try=false; a._ok=true; if(a.muted){ a.pause(); a.currentTime=0; a.muted=false; } };
        if(p&&p.then) p.then(done).catch(()=>{ a._try=false; a.muted=false; }); else done(); }catch(e){ a._try=false; a.muted=false; } }); }
  return { unlock:wake,
    heart(on,r){ if(r) bpm=r; clearTimeout(beatT); if(!on) return; const loop=()=>{ play("beat"); beatT=setTimeout(loop,60000/bpm); }; loop(); },
    rate(r){ bpm=r; }, exhale(){ play("exhale"); }, inhale(){ play("inhale"); }, tick(){ play("tick"); }, bell(){ play("bell"); }, stamp(){ play("stamp"); }, shutter(){ play("shutter"); },
    scrape(){ play("scrape"); }, pickup(){ play("pickup"); }, creak(){ play("door"); }, flies(){ play("flies"); }   /* a metal door: latch, rattle, long hinge squeal, hollow panel */,
    /* the riot file swells, barks and fades by itself; letting go fades it out (desktop) and stops it */
    riot(on){ clearTimeout(riotT); const a=els.riot[0];
      if(on){ play("riot"); return; }
      if(a.paused) return; let v=1; const step=()=>{ v-=.1; try{ a.volume=Math.max(0,v); }catch(e){} if(v>0) riotT=setTimeout(step,100); else halt("riot"); }; step(); },
    /* a long-distance ringback: one long tone, then silence, again and again */
    ring(on,onEach){ clearTimeout(ringT); if(!on){ halt("ring"); return; } const loop=()=>{ play("ring"); onEach&&onEach(); ringT=setTimeout(loop,3200); }; loop(); } }; })();

/* ---------- tap that also works on iPhone ----------
   Fires on touchend (no waiting for iOS's synthetic click); a click right after a touch is ignored. */
let lastTouchAt=0;
function onTap(el,fn){
  let startX=0,startY=0,moved=false;
  el.addEventListener("touchstart",e=>{ const t0=e.changedTouches[0]; startX=t0.clientX; startY=t0.clientY; moved=false; },{passive:true});
  el.addEventListener("touchmove",e=>{ const t0=e.changedTouches[0]; if(Math.abs(t0.clientX-startX)>12||Math.abs(t0.clientY-startY)>12) moved=true; },{passive:true});
  el.addEventListener("touchend",e=>{ if(moved) return; e.preventDefault(); lastTouchAt=Date.now(); fn(e); },{passive:false});
  el.addEventListener("click",e=>{ if(Date.now()-lastTouchAt<700) return; fn(e); });
}
/* ---------- press-and-hold that also works on iPhone ----------
   Touch: touchstart/touchend with preventDefault (stops iOS long-press menus and text selection).
   Mouse: mousedown on the button, mouseup anywhere. Returns a function that removes the listeners. */
function holdable(el,onDown,onUp){
  const ts=e=>{ e.preventDefault(); onDown(e); }, te=e=>{ e.preventDefault(); onUp(); }, tc=()=>onUp();
  const md=e=>{ if(e.button!==0) return; onDown(e); }, mu=()=>onUp();
  el.addEventListener("touchstart",ts,{passive:false}); el.addEventListener("touchend",te,{passive:false}); el.addEventListener("touchcancel",tc);
  el.addEventListener("mousedown",md); addEventListener("mouseup",mu); el.addEventListener("contextmenu",e=>e.preventDefault());
  return ()=>{ el.removeEventListener("touchstart",ts); el.removeEventListener("touchend",te); el.removeEventListener("touchcancel",tc); el.removeEventListener("mousedown",md); removeEventListener("mouseup",mu); };
}

(()=>{ const ui=document.getElementById("ui"); if(!ui) return;

(()=>{ const b=document.getElementById("fs"), d=document, el=d.documentElement; if(!b) return;

  const isFs=()=>d.fullscreenElement||d.webkitFullscreenElement, upd=()=>{ b.textContent=isFs()?"✕ Exit full screen":"⛶ Full screen"; };
  b.addEventListener("click",()=>{ try{ if(isFs()) ext.call(d); else { const p=req.call(el); if(p&&p.catch) p.catch(()=>{});
    try{ const o=screen.orientation; if(o&&o.lock) o.lock("landscape").catch(()=>{}); }catch(e){} } }catch(e){} });

function voice(lines, fa){

  words.forEach((w,k)=>{ const s=document.createElement("span"); s.className="w"; s.textContent=w+(k<words.length-1?" ":""); p.appendChild(s); });
  const spans=[...p.children]; const step=()=>{ if(i<spans.length){ spans[i++].classList.add("on"); later(step, 260+Math.min(260,spans[i-1].textContent.length*22)); } else if(fa){ const f=document.createElement("div"); f.className="fa"; f.lang="fa"; f.textContent=fa; box.appendChild(f); requestAnimationFrame(()=>f.classList.add("on")); } };

const wallStore=(()=>{ let db=null, user=null, myId=null, lines=[], listeners=new Set(), canWrite=null, started=false;

    try{ myId=user? await user.id() : null; }catch(_){}
    try{ canWrite=user? await user.can("data.write") : null; }catch(_){}
    db.collection("wall").orderBy("at","desc").limit(120).onSnapshot(s=>{ lines=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>typeof x.text==="string"); listeners.forEach(f=>f(lines)); },()=>{});
  }
  async function add(text){ if(!db||!myId||canWrite===false) return false;
    try{ await db.doc("wall/"+myId).set({text:text.slice(0,34),at:Date.now()}); return true; }catch(_){ canWrite=false; return false; } }
  return { start, add, on(f){ listeners.add(f); f(lines); return ()=>listeners.delete(f); }, get lines(){ return lines; }, get myId(){ return myId; } };
})();

/* deterministic spot for a line on the wall, from its id */
function spotFor(id){ let h=2166136261; for(const c of id) h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
  const r=k=>((h=Math.imul(h^(h>>>13),1274126177)>>>0)%1000)/1000;
  return { x:6+r()*58, y:6+r()*86, rot:-9+r()*14 }; }

  skipBtn();
  const cv=$("rv"), ctx=cv.getContext("2d"); let ready=false, downP=false, lastP=null, brush=40, done=false, W=1, H=1;
  /* coverage is counted on a 16×9 grid (no pixel reading, so it works whatever the browser allows) */
  const GX=16, GY=9, seen=new Set();
  later(()=>{ const r=frame.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.scale(dpr,dpr); brush=Math.max(36,W*.12);
    try{ ctx.drawImage(v(),0,0,W,H); }catch(_){ ctx.fillStyle="#333"; ctx.fillRect(0,0,W,H); }
    ctx.globalCompositeOperation="destination-out"; ready=true; },60);
  function mark(x,y){ const rx=brush/2; for(let gx=0;gx<GX;gx++) for(let gy=0;gy<GY;gy++){ const cx=(gx+.5)*W/GX, cy=(gy+.5)*H/GY; if(Math.hypot(cx-x,cy-y)<rx+W/GX*.3) seen.add(gx+","+gy); } }
  function rub(x,y){ if(!ready||done) return; ctx.lineCap="round"; ctx.lineWidth=brush; ctx.beginPath(); ctx.moveTo(lastP?lastP[0]:x,lastP?lastP[1]:y); ctx.lineTo(x+.1,y); ctx.stroke();

    lastP=[x,y]; if(seen.size/(GX*GY)>.55) finish(); }
  const pos=e=>{ const q=cv.getBoundingClientRect(); return [e.clientX-q.left,e.clientY-q.top]; };
  cv.onpointerdown=e=>{ downP=true; lastP=null; try{ cv.setPointerCapture(e.pointerId); }catch(_){} rub(...pos(e)); $("ask").hidden=true; };

},

    <path d="M90 32 Q100 50 104 62 T118 90" class="canal amstel"/>
    <ellipse cx="40" cy="81" rx="8.5" ry="3" class="park"/>
    <rect x="146" y="80" width="12" height="5.5" rx="1" class="cs"/><text x="152" y="78.4" class="lab on">AZC</text>
    <polyline id="trail" class="trail" points=""/>
    ${SPOTS.map(p=>`<g class="spot" id="sp-${p.id}"><circle cx="${p.x}" cy="${p.y}" r="1.5"/><circle class="halo" cx="${p.x}" cy="${p.y}" r="3.2"/><text x="${p.x}" y="${p.y-3.8}" class="lab">${p.n}</text></g>`).join("")}
    <circle id="me" class="me" cx="152" cy="82.75" r="1.5"/>
   </svg>
   <div class="ask" id="ask">${t("bk_ask")}</div>`);
  skipBtn();
  requestAnimationFrame(()=>{ $("dim").classList.add("on"); $("vn").classList.add("on"); });
  const svg=$("vn"), trail=$("trail"), me=$("me"); let pts=[], downP=false, seen=new Set(), done=false, lastTick=0;
  const pt=e=>{ const r=svg.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*160,(e.clientY-r.top)/r.height*90]; };
  function add([x,y]){ if(done) return; pts.push([x,y]); if(pts.length>900) pts.shift(); trail.setAttribute("points",pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")); me.setAttribute("cx",x); me.setAttribute("cy",y);
    const now=performance.now(); if(now-lastTick>260){ lastTick=now; snd.tick(); }
    SPOTS.forEach(p=>{ if(!seen.has(p.id) && Math.hypot((p.x-x)*1,(p.y-y)*1.6)<7){ seen.add(p.id); $("sp-"+p.id).classList.add("on"); snd.pickup(); if(seen.size===SPOTS.length) finish(); } }); }
  svg.onpointerdown=e=>{ downP=true; try{ svg.setPointerCapture(e.pointerId); }catch(_){} add(pt(e)); $("ask").hidden=true; };
  svg.onpointermove=e=>{ if(downP) add(pt(e)); };
  svg.onpointerup=svg.onpointercancel=()=>{ downP=false; };
  function finish(){ done=true; snd.bell(); svg.classList.add("done");
    later(()=>{ const ms=voice(t("bk_v")); later(()=>{ $("dim").classList.remove("on"); svg.classList.remove("on"); next(); },Math.max(3800,ms+1600)); },900); }
},

/* CH3 · THE BIRD — hold it warm; its small fast heart beats under your hand */
bird(){
  const MAX=5, C=2*Math.PI*46;
  ui.insertAdjacentHTML("beforeend",`<div class="warm" id="wm"></div>
   <button class="hold birdhold pulse" id="bdh" type="button" aria-label="${t("bd_aria")}"><svg viewBox="0 0 100 100"><circle class="base" cx="50" cy="50" r="46" fill="none" stroke="#ece8de" stroke-width="2"/><circle id="barc" cx="50" cy="50" r="46" fill="none" stroke="#D6A93E" stroke-width="5" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><span class="lbl" id="bdl">${t("bd_hold")}</span></button>
   <div class="ask" id="ask">${t("bd_ask")}</div>`);
  skipBtn();
  const b=$("bdh"), arc=$("barc"); let holding=false, held=0, raf=0, last=performance.now(), done=false;
  function loop(tm){ const dt=(tm-last)/1000; last=tm;
    if(holding){ held=Math.min(MAX,held+dt); arc.style.strokeDashoffset=C*(1-held/MAX); snd.rate(150-held*12); if(held>=MAX) return finish(); }
    raf=requestAnimationFrame(loop); }
  function down(e){ if(done||holding) return; e.preventDefault(); holding=true; b.classList.remove("pulse"); $("bdl").textContent="…"; $("ask").hidden=true; $("wm").classList.add("on"); snd.heart(true,150); }
  function up(){ if(done||!holding) return; holding=false; snd.heart(false); $("wm").classList.remove("on"); $("bdl").innerHTML=t("bd_hold"); }
  function finish(){ done=true; holding=false; snd.heart(false); cancelAnimationFrame(raf); b.hidden=true;
    const ms=voice(t("bd_v")); later(()=>{ $("wm").classList.remove("on"); next(); },Math.max(4200,ms+1800)); }
  const offHold=holdable(b,down,up);
  const kd=e=>{ if(e.code==="Space"&&!e.repeat) down(e); }, ku=e=>{ if(e.code==="Space") up(); };
  addEventListener("keydown",kd); addEventListener("keyup",ku);
  raf=requestAnimationFrame(loop);
  cleanup=()=>{ cancelAnimationFrame(raf); snd.heart(false); offHold(); removeEventListener("keydown",kd); removeEventListener("keyup",ku); };
},

/* 4 · THE PHOTO — the viewer takes it; the yellow card shows a number for a name */
photo(){
  frame.classList.add("gray");
  ui.insertAdjacentHTML("beforeend",`<div class="finder" id="fd"><i></i><i></i><i></i><i></i><span>● REC</span></div>
    <button class="shoot" id="shoot" type="button" aria-label="${t("f_aria")}"></button><div class="flash" id="fl"></div>
    <div class="ask" id="ask">${t("f_ask")}</div>`);
  skipBtn();
  onTap($("shoot"),()=>{ $("shoot").remove(); $("ask").hidden=true; snd.shutter(); $("fl").classList.add("go"); frame.classList.remove("gray"); $("fd").style.opacity=0;
    const num=myNumber(true);
    ui.insertAdjacentHTML("beforeend",`<div class="ycard" id="yc" role="img" aria-label="${t("y_aria",num)}"><canvas id="ycp" width="300" height="400"></canvas>
      <div class="info"><div><div class="lab">${t("y_name")}</div><div class="name">Sam</div></div><div><div class="lab">${t("y_num")}</div><div class="num">${num}</div></div></div></div>`);
    try{ const c=$("ycp").getContext("2d"), vv=v(), vw=vv.videoWidth||1280, vh=vv.videoHeight||720; const sw=vh*0.75, sx=(vw-sw)/2; c.drawImage(vv,sx,0,sw,vh,0,0,300,400); }catch(_){}
    later(()=>$("yc").classList.add("on"),900);
    later(()=>voice(t("f_v")),1500);
    later(next,10500); });
}
};

<script>/* ============================================================
   VANUIT DE KAMER (iframe)
   ?embed=1 : geen startkaart, het eerste filmbeeld staat klaar. De kamer roept
     ldPrime() aan op het moment van de klik (dan mag de browser geluid afspelen)
     en ldStart() zodra de overgang klaar is. Via file:// gaat het met postMessage.
   ?autoplay=1 : meteen starten.
   Los geopend gedraagt het hoofdstuk zich als vanouds.
   ============================================================ */
(function(){
  const q=location.search, inRoom=window.parent!==window;
  if(inRoom){ const tr=$("toRoom"); if(tr) tr.style.display="none";
    document.querySelectorAll("[data-room]").forEach(a=>{ const b=a.cloneNode(true); a.replaceWith(b); b.addEventListener("click",e=>{ e.preventDefault(); parent.postMessage("ld-room-back","*"); }); });
    // aan het eind geen eindkaart: meteen terug naar de kamer
    const ce=$("cardEnd"); ce.style.display="none"; let back=false;
    new MutationObserver(()=>{ if(!back&&!ce.classList.contains("off")){ back=true; parent.postMessage("ld-room-back","*"); } }).observe(ce,{attributes:true,attributeFilter:["class"]}); }
  function unmuteChip(){ const b=document.createElement("button"); b.className="btn"; b.type="button"; b.textContent="Geluid aan";
    b.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60";
    b.onclick=()=>{ vids.forEach(v=>v.muted=false); try{ snd.unlock(); }catch(_){} b.remove(); }; document.body.appendChild(b); }
  function start(){
    $("cardStart").classList.add("off"); document.body.classList.remove("ld-wait");
    vids[0].currentTime=0;
    vids[0].play().then(()=>setPlaying(true)).catch(()=>{
      // de browser wil geen geluid zonder klik: dan zonder geluid starten, met een knop om het aan te zetten
      vids.forEach(v=>v.muted=true);
      vids[0].play().then(()=>{ setPlaying(true); unmuteChip(); }).catch(()=>{ $("cardStart").classList.remove("off"); });
    });
    preload(1);
  }
  if(/[?&]embed\b/.test(q)){
    $("cardStart").classList.add("off"); document.body.classList.add("ld-wait");
    const st=document.createElement("style"); st.textContent=".ld-wait .top,.ld-wait .ctl{opacity:0;pointer-events:none}.top,.ctl{transition:opacity .8s}"; document.head.appendChild(st);
    segI=0; cur=0; vids[0].preload="auto"; vids[0].src=SEGS[0].src; vids[0].classList.remove("hide"); vids[1].classList.add("hide");
    let primed=false;
    window.ldPrime=()=>{ if(primed) return; primed=true; try{ snd.unlock(); }catch(_){}
      vids.forEach(v=>{ try{ const p=v.play(); if(p&&p.catch) p.catch(()=>{}); v.pause(); }catch(_){} }); };
    window.ldStart=start;
    addEventListener("message",e=>{ if(e.data==="ld-prime") ldPrime(); if(e.data==="ld-start") start(); });
    parent.postMessage("ld-ready","*");
  } else if(/[?&]autoplay\b/.test(q)){ try{ snd.unlock(); }catch(_){} vids[0].src=SEGS[0].src; segI=0; cur=0; vids[0].classList.remove("hide"); vids[1].classList.add("hide"); start(); }
})();
</script>
