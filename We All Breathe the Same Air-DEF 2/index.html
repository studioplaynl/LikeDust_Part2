<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one 16:9 stage, letterboxed; HUD sits on the stage like captions on a film frame */
:root{
  --ink:#0d0c0b;        /* letterbox + panels */
  --paper:#efe6d2;      /* text, like the reject letter */
  --dim:#a99f8a;        /* secondary text */
  --lamp:#f2c76b;       /* warm window light = interactive */
  --stamp:#c8332b;      /* REJECT stamp red, used once */
  --veil:rgba(13,12,11,.72);
  --f-display:"Special Elite","Courier New",monospace;
  --f-body:"Literata",Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#wrap{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#111}
#stage>img,#stage>canvas{position:absolute;display:block;max-width:none;pointer-events:none;user-select:none}
.obj{transition:opacity .35s ease, filter .25s ease}
#o-bike{transform-origin:0 0;transition:opacity .35s ease, filter .25s ease, transform .9s cubic-bezier(.45,0,.2,1)}
#o-bike.moved{transform:translate(129px,0)}
.obj.glow{filter:drop-shadow(0 0 10px rgba(242,199,107,.95)) drop-shadow(0 0 2px rgba(242,199,107,1)) brightness(1.12)}
.obj.gone{opacity:0}
/* geld op tafel beweegt tijdens hoofdstuk Amsterdam: biljetten wapperen en schuiven een beetje */
#o-money{transform-origin:50% 90%}
#count{left:1400px;top:900px;width:360px;height:180px}
#o-birdfly{transform-origin:50% 50%}
#flyc{left:0;top:0;width:1920px;height:1080px}
/* filmisch tussenshot: zwarte balken boven en onder (cinemascope) */
#cine{position:absolute;inset:0;background:#000;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .55s ease;z-index:3}
#cine.on{opacity:1}
#cine video{width:100%;height:100%;object-fit:contain;display:block}
#plant{display:none}
#tally{display:none}
#cal{display:none}
#stack{position:absolute;left:392px;top:524px;width:240px;height:220px;pointer-events:none}   /* stapel brieven op het bureau */
#board{position:absolute;left:1640px;top:120px;width:280px;height:600px;pointer-events:none}   /* schoolbord: eerst leeg, met de tijd komt het krijt terug */   /* scheurkalender op de muur: de tijd die voorbijgaat */   /* vooraan op het bureau, dichter bij de kijker: je ziet hem goed groeien */
#o-money.flutter{animation:flutter 1.1s steps(3,end) infinite}
@keyframes flutter{0%,100%{transform:rotate(0) translateY(0) skewX(0)}25%{transform:rotate(-2.5deg) translateY(-4px) skewX(3deg)}50%{transform:rotate(1.5deg) translateY(-1px) skewX(-2deg)}75%{transform:rotate(-1deg) translateY(-5px) skewX(2deg)}}
@media (prefers-reduced-motion:reduce){#o-money.flutter{animation:none}}
.obj.cue{animation:none}
#o-man.cue{animation:none}
@keyframes cueSam{0%,100%{filter:drop-shadow(0 0 0 rgba(242,199,107,0))}50%{filter:drop-shadow(0 0 5px rgba(242,199,107,.35)) brightness(1.04)}}
/* kleur aan / uit: warm goud dat oplicht en weer wegzakt */
@keyframes cue{0%,100%{filter:drop-shadow(0 0 0 rgba(242,199,107,0)) sepia(0) saturate(1) brightness(1)}
  45%,60%{filter:drop-shadow(0 0 10px rgba(242,199,107,.75)) drop-shadow(0 0 2px rgba(255,236,200,.9)) sepia(.45) saturate(1.45) brightness(1.18)}}
@media (prefers-reduced-motion:reduce){.obj.cue{animation:none;filter:drop-shadow(0 0 10px rgba(242,199,107,.9))}}
.soft{mix-blend-mode:soft-light}
#stage{isolation:isolate}
/* dag -> avond: --eve loopt van 0 (middag) naar 1 (avond) met de hoofdstukken mee */
#stage{--eve:0}
#eve{position:absolute;inset:0;pointer-events:none}
#eve .m{position:absolute;inset:0;background:linear-gradient(180deg,#34385f 0%,#4d4266 50%,#6a4636 100%);mix-blend-mode:multiply;opacity:calc(var(--eve)*.6);transition:opacity 5s ease}
#eve .w{position:absolute;inset:0;background:radial-gradient(ellipse 26% 34% at 40% 41%,rgba(255,132,52,.95),rgba(255,110,40,0) 72%),linear-gradient(200deg,rgba(255,120,50,.35),rgba(255,120,50,0) 45%);mix-blend-mode:soft-light;opacity:var(--eve);transition:opacity 5s ease}
#o-light1,#o-light2{opacity:calc(1 - var(--eve));transition:opacity 5s ease}
.rays{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;mix-blend-mode:screen}
#raysA{animation:raysA 9s ease-in-out infinite}
#raysB{animation:raysB 13s ease-in-out infinite}
@keyframes raysA{0%,100%{filter:brightness(1)}50%{filter:brightness(.7)}}
@keyframes raysB{0%,100%{opacity:0}50%{opacity:.8}}
/* kleurgrading: koele schaduwen, warme hooglichten */
#grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(180deg,rgba(40,80,110,.2),rgba(30,60,80,.12) 60%,rgba(120,70,30,.3))}
/* warm middaglicht; zakt weg als de avond komt (dan neemt het oranje avondlicht het over) */
#warm{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:calc(1 - var(--eve)*.6);transition:opacity 5s ease;
  background:radial-gradient(ellipse 55% 60% at 44% 55%,rgba(255,176,96,.42),rgba(255,160,80,.16) 70%,rgba(255,150,70,.08))}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;mix-blend-mode:overlay;opacity:.07;image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){#raysA,#raysB{animation:none}}
#shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 72% 68% at 48% 52%,rgba(8,7,6,0) 40%,rgba(8,7,6,.55) 100%),rgba(8,7,6,.15)}
#dust{left:0;top:0;width:1920px;height:1080px}
.hot .ping{display:none!important}
#rings{display:none;position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}
.ring{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .9s ease,stroke .3s ease;opacity:0;stroke:var(--lamp)}
.ring path{fill:none}
.ring.flash{opacity:1;transition:opacity .2s ease}
.ring.hover{opacity:.9;transition:opacity .25s ease}
.ring.busy{opacity:0!important}
.ring.draw path{animation:drawring 1.1s cubic-bezier(.5,0,.2,1) both}
.ring.draw path+path{animation-delay:.25s}
@keyframes drawring{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes breathe{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.ring.draw path{animation:none}}
#marker{position:absolute;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .8s ease;z-index:2}
#marker.on{opacity:1;transition-delay:.6s}
#marker b{display:none}
#marker i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,206,84,.8);animation:ripple 3.4s ease-out infinite}
#marker i+i{display:none}
@keyframes ripple{0%{transform:scale(1);opacity:0}15%{opacity:.7}100%{transform:scale(4.5);opacity:0}}
@keyframes twinkle{50%{opacity:.45;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){#marker i{display:none}#marker b{animation:none}}
#gl{left:0;top:0;width:1920px;height:1080px}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;border-radius:14px}
.hot:focus-visible{outline:3px dashed var(--lamp);outline-offset:4px}
.hot[disabled]{cursor:default}
.hot .ping{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:2px solid var(--lamp);opacity:.0;pointer-events:none}
.hot.hint:not([disabled]) .ping{animation:ping 2.2s ease-out infinite}
.hot.done .ping{display:none}
@keyframes ping{0%{transform:scale(.5);opacity:.95}80%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.tag{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;
  font:300 26px/1 var(--f-body);letter-spacing:.05em;background:var(--veil);color:var(--paper);padding:10px 16px;border-radius:4px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.hot .tag{display:none!important}   /* geen naamlabels op de voorwerpen, ook niet op de computer */
.hot[disabled] .tag,body.busy .tag{opacity:0!important;transition:opacity .1s}
.hot.done .tag::after{content:"  \2713";color:var(--lamp)}

.hot.locked{cursor:default}
.hot.locked .tag{display:none}
.hot.locked .ping{display:none}

/* UI-laag: los van het podium, schaalt met het scherm (telefoon, tablet, desktop) */
#ui{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(10,9,8,.55),rgba(10,9,8,0));padding-bottom:28px}
#novel{font:clamp(10px,1.05vw,15px)/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);text-shadow:0 2px 10px #000}
#chips{display:flex;gap:6px;margin-top:8px;pointer-events:auto;flex-wrap:wrap}
.chip{font:300 clamp(11px,1vw,14px)/1 var(--f-body);letter-spacing:.03em;color:var(--paper);background:var(--veil);border:1px solid rgba(239,230,210,.22);
  padding:.5em .7em;border-radius:4px;cursor:pointer;display:flex;gap:.45em;align-items:center;min-height:30px}
.chip b{font:400 1em/1 var(--f-display);color:var(--dim)}
.chip.next{border-color:var(--lamp);color:var(--lamp)}
.chip.done b{color:var(--lamp)}
.chip.done::after{content:"\2713";color:var(--lamp)}
.chip[disabled]{opacity:.45;cursor:default}
.chip:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#tools{display:flex;gap:8px;pointer-events:auto;flex-shrink:0}
.tbtn{font:600 clamp(11px,1vw,14px)/1 var(--f-body);color:var(--paper);background:var(--veil);border:1px solid rgba(239,230,210,.25);
  padding:.6em .9em;border-radius:4px;cursor:pointer;min-height:32px}
.tbtn:hover{border-color:var(--lamp);color:var(--lamp)}
.tbtn:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#caption{position:absolute;left:50%;top:clamp(64px,13vh,130px);transform:translateX(-50%);width:max-content;max-width:min(88vw,760px);text-align:center;
  font:italic 400 clamp(14px,1.9vw,26px)/1.35 var(--f-body);color:var(--paper);background:var(--veil);padding:.5em 1em;border-radius:4px;
  opacity:0;transition:opacity .4s}
#caption.show{opacity:1}
.card{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(10,9,8,.88);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  opacity:0;pointer-events:none;transition:opacity .7s ease;overflow:auto}
.card.show{opacity:1;pointer-events:auto}
#end.final{background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(10,9,8,.72),rgba(10,9,8,.35) 70%,rgba(10,9,8,.15));transition:opacity 3s ease}
#end.final h2{text-shadow:0 2px 30px rgba(0,0,0,.8)}
.card .k{font:clamp(11px,min(1.4vw,2.6vh),18px)/1.2 var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.card h1,.card h2{font:400 clamp(30px,min(6.4vw,11vh),92px)/1.05 var(--f-display);margin:.25em 0 0;text-wrap:balance;color:var(--paper)}
.card p{font:400 clamp(14px,min(1.8vw,3.4vh),22px)/1.5 var(--f-body);color:var(--dim);max-width:34em;margin:.9em auto 0}
.card .sub{font:italic 400 clamp(15px,min(2vw,3.8vh),26px)/1.4 var(--f-body);color:var(--dim);margin-top:.6em}
.card .rule{width:80px;height:3px;background:var(--stamp);margin:clamp(14px,3vh,28px) auto 0;transform:rotate(-2deg)}
.card button.big{margin-top:clamp(16px,4vh,38px);font:clamp(15px,min(1.8vw,3.4vh),24px)/1 var(--f-display);color:var(--ink);background:var(--lamp);border:0;padding:.8em 1.6em;border-radius:4px;cursor:pointer;min-height:44px}
.card button.big:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
/* hoofdstuktitel over de kamer heen: de kamer blijft zichtbaar en Sam begint al */
.card.title{background:radial-gradient(ellipse 60% 45% at 50% 50%,rgba(10,9,8,.62),rgba(10,9,8,.18) 75%,rgba(10,9,8,0));pointer-events:none!important;transition:opacity 1s ease}
.card.title h2{text-shadow:0 2px 24px rgba(0,0,0,.7)}
/* titel links in beeld, zodat hij nooit over Sam valt (Sam staat altijd midden/rechts) */
.card.title{place-items:center start;text-align:left;padding-left:max(5vw,env(safe-area-inset-left,0px));
  background:linear-gradient(90deg,rgba(10,9,8,.6),rgba(10,9,8,.25) 32%,rgba(10,9,8,0) 48%)}
.card.title>div{max-width:min(40vw,560px)}
.card.title .rule{margin-left:0}
.card.title h2{font-size:clamp(28px,min(5.2vw,9vh),80px)}
.card.title .k,.card.title .sub{color:var(--paper);text-shadow:0 1px 12px rgba(0,0,0,.8)}
#loadbar{width:min(320px,60vw);height:4px;background:rgba(239,230,210,.15);margin:clamp(16px,4vh,32px) auto 0;border-radius:3px;overflow:hidden}
#loadbar span{display:block;height:100%;width:0;background:var(--lamp);transition:width .2s}
#rotate{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(10,9,8,.94);pointer-events:auto;z-index:10;color:var(--paper);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#rotate svg{color:var(--lamp);animation:turn 2.4s ease-in-out infinite}
#rotate p{font:400 18px/1.5 var(--f-body);color:var(--paper);max-width:18em;margin:16px auto 0}
#rotate button.big{margin-top:22px;font:16px/1 var(--f-display);color:var(--ink);background:var(--lamp);border:0;padding:.9em 1.6em;border-radius:4px;min-height:44px}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* kleine schermen: hoofdstukken alleen als nummer */
@media (max-width:900px),(max-height:520px){.chip .t{display:none}#novel{display:none}#chips{margin-top:0}}
@media (prefers-reduced-motion:reduce){.card,.obj,#caption{transition:none}#rotate svg{animation:none}}
#marker{transform:scale(var(--ui,1))}

/* Safari/iPhone: alleen de eenvoudigste lichtlagen (mengmodi geven daar rare vlekken en sprongen) */
.safari #eve .w,.safari #grade,.safari #warm,.safari .soft{display:none!important}
.safari #eve .m{mix-blend-mode:normal;background:linear-gradient(180deg,rgba(18,22,50,.6),rgba(34,26,52,.52) 50%,rgba(46,26,16,.48));opacity:calc(var(--eve)*.8)}
.safari .rays{mix-blend-mode:normal;opacity:.8}
.safari #raysA,.safari #raysB{animation:none}
.safari #raysB{opacity:0}

/* telefoons: geen doorlopende filter-animaties op grote lagen */
.lite #raysA,.lite #raysB{animation:none}
.lite #raysB{display:none}
#grain{display:none!important}   /* filmkorrel staat uit: laag helemaal weg, scheelt rekenwerk */
/* telefoons (ook Android): geen mengmodi, die kosten bij elke videoframe veel rekenkracht */
.lite #eve .w,.lite #grade,.lite #warm,.lite .soft{display:none!important}
.lite #eve .m{mix-blend-mode:normal;background:linear-gradient(180deg,rgba(18,22,50,.6),rgba(34,26,52,.52) 50%,rgba(46,26,16,.48));opacity:calc(var(--eve)*.8)}
.lite .rays{mix-blend-mode:normal;opacity:.8}
/* hoofdstuktitel op telefoons: geen schermvullende waas, alleen de letters */
.lite .card.title{background:none;transition:opacity .6s ease}
/* hoofdstuk 4: titel rechts, zodat de poster links vrij blijft */
.card.title.right{place-items:center end;text-align:right;padding-left:16px;padding-right:max(5vw,env(safe-area-inset-right,0px));
  background:linear-gradient(270deg,rgba(10,9,8,.6),rgba(10,9,8,.25) 32%,rgba(10,9,8,0) 48%)}
.card.title.right .rule{margin-left:auto;margin-right:0}
.lite .card.title.right{background:none}
/* telefoon rechtop: de kamer is dan een strook in het midden; titel in de lege ruimte erboven, niet over Sam */
@media (orientation:portrait){.card.title,.card.title.right{place-items:start center;text-align:center;padding-top:max(13vh,90px);padding-left:16px;padding-right:16px;background:none}
  .card.title.right .rule{margin-left:auto;margin-right:auto}
  .card.title>div{max-width:100%}.card.title .rule{margin-left:auto}.card.title h2{font-size:clamp(28px,10vw,56px)}}
.lite .card.title h2,.lite .card.title .k,.lite .card.title .sub{text-shadow:0 1px 6px rgba(0,0,0,.95)}
</style>

(function(){return;   // vervangen door de scheurkalender

  const MAP=[[0,2],[.12,3],[.35,5],[.51,12],[.675,22],[.84,37],[1,58]];
  const cnt=t=>{for(let i=1;i<MAP.length;i++)if(t<=MAP[i][0]){const [a,ca]=MAP[i-1],[b,cb]=MAP[i];return ca+(cb-ca)*(t-a)/(b-a);}return MAP[MAP.length-1][1];};
  let g=.12,target=.12;window.__plant=t=>{target=t;};window.__plantNow=t=>{target=t;g=t;};

      x.strokeStyle=s===1?'rgba(226,219,204,.78)':'rgba(226,219,204,.32)';x.stroke();}

    const n=Math.floor(8*p);for(let q=0;q<n;q++){const u=(q+.5)/8;x.fillStyle='rgba(30,26,22,.35)';x.fillRect(ax+(bx-ax)*u+(j-.5)*1.2,ay+(by-ay)*u,1,1.2);}}

  img.onload=()=>{dirty=true;};
  function draw(now){const st=step12(now);let anim=false;
    if(img.complete&&img.naturalWidth&&(dirty||st!==lastSt)){
      const prog={};for(const i in shown){const p=Math.max(0,Math.min(1,(now-shown[i])/1600));prog[i]=p;if(p<1)anim=true;}
      let fa=fullT===null?0:Math.max(0,Math.min(1,(now-fullT)/1800));if(fullT!==null&&fa<1)anim=true;
      if(dirty||anim){lastSt=st;dirty=false;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,560,1200);
        if(fa<1){x.globalAlpha=1-fa;x.drawImage(img,0,0,560,1200);x.globalAlpha=1;
          x.setTransform(2,0,0,2,0,0);x.globalCompositeOperation='destination-out';
          for(const i in prog){const [,rx,ry,rw,rh]=REG[i],p=prog[i];if(p<=0)continue;
            // 'schrijven': van linksboven naar rechtsonder vrijgeven, met zachte rand
            const L=rw+rh*.6,front=p*(L+30);const g=x.createLinearGradient(rx,ry,rx+L*.86,ry+L*.5);
            const a=Math.max(0,Math.min(1,(front-30)/L)),b=Math.max(0,Math.min(1,front/L));
            g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(a,'rgba(0,0,0,1)');g.addColorStop(Math.max(a,b),'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0)');
            x.fillStyle=g;x.beginPath();if(x.roundRect)x.roundRect(rx,ry,rw,rh,10);else x.rect(rx,ry,rw,rh);x.fill();}
          x.globalCompositeOperation='source-over';}}}
    requestAnimationFrame(draw);}
  requestAnimationFrame(draw);})();

/* ===== Stapel brieven en formulieren op het bureau: bij elk hoofdstuk komt er post bij ===== */
(function(){const cv=$('stack'),x=cv.getContext('2d');
  const MAP=[[0,1],[.12,1],[.35,2],[.51,5],[.675,9],[.84,14],[1,19]];
  const want=t=>{let n=1;for(const [a,c] of MAP)if(t>=a-1e-4)n=c;return n;};
  let r=5;const R=()=>{r=(r*16807)%2147483647;return r/2147483647;};
  const KINDS=[{f:'#cfc8b8',lines:1},{f:'#bfae8c',env:1},{f:'#d6cfc0',lines:1,stamp:1},{f:'#9f845b',env:1},{f:'#c4c8ca',lines:1},{f:'#cdc2ae',env:1,stamp:1}];
  const IT=[];for(let i=0;i<20;i++){const k=KINDS[Math.floor(R()*KINDS.length)];IT.push({k,w:70+R()*16,h:90+R()*12,rot:(R()-.5)*.5,dx:(R()-.5)*14,dy:(R()-.5)*6});}
  let shown=1,drops=[],dirty=true,lastSt=-1;
  function chain(t,instant){const n=want(t);if(n<=shown){return;}const now=performance.now();
    for(let i=shown;i<n;i++)drops.push({i,t0:instant?-1e9:now+(i-shown)*380});
    if(!instant&&!muted&&actx)for(let i=0;i<n-shown;i++)setTimeout(()=>{try{rustle();}catch(e){}},i*380+250);shown=n;dirty=true;}
  const p0=window.__plant,p1=window.__plantNow;
  window.__plant=t=>{p0&&p0(t);chain(t,false);};
  window.__plantNow=t=>{p1&&p1(t);shown=1;drops=[];chain(t,true);};
  const BX=120,BY=170,TH=2.6;   // onderkant van de stapel (lokaal) en dikte per vel
  function item(it,lift,alpha){const k=it.k;x.save();x.globalAlpha=alpha;
    // bovenaanzicht op het schuine bureaublad: draaien, dan plat drukken
    x.translate(0,-lift);x.scale(1,.42);x.rotate(-.26+it.rot);
    const w=it.w,h=it.h;x.fillStyle='rgba(0,0,0,.25)';x.fillRect(-w/2+3,-h/2+5,w,h);
    x.fillStyle=k.f;x.fillRect(-w/2,-h/2,w,h);x.lineWidth=2;x.strokeStyle='#1b1712';x.strokeRect(-w/2,-h/2,w,h);
    if(k.env){x.beginPath();x.moveTo(-w/2,-h/2);x.lineTo(0,-h*.05);x.lineTo(w/2,-h/2);x.lineWidth=1.4;x.strokeStyle='rgba(27,23,18,.6)';x.stroke();}
    if(k.lines){x.strokeStyle='rgba(40,34,28,.45)';x.lineWidth=2.2;for(let j=0;j<7;j++){const yy=-h/2+16+j*11;x.beginPath();x.moveTo(-w/2+10,yy);x.lineTo(w/2-10-(j%3)*12,yy);x.stroke();}}
    if(k.stamp){x.strokeStyle='rgba(150,36,28,.8)';x.lineWidth=2.5;x.strokeRect(w/2-34,h/2-24,26,16);}
    x.restore();}
  function draw(now){const st=step12(now);const anim=drops.some(d=>now-d.t0<700);
    if((dirty||anim)&&st!==lastSt){lastSt=st;dirty=false;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,480,440);x.setTransform(2,0,0,2,0,0);
      const fall={};for(const d of drops)fall[d.i]=Math.max(0,Math.min(1,(now-d.t0)/700));
      for(let i=0;i<shown;i++){const it=IT[i];let p=i in fall?fall[i]:1;if(p<=0)continue;const e=1-Math.pow(1-p,3);
        x.save();x.translate(BX+it.dx+(1-e)*-30,BY+it.dy*.4);item(it,i*TH+(1-e)*60,Math.min(1,p*2));x.restore();}
      drops=drops.filter(d=>now-d.t0<700);}
    requestAnimationFrame(draw);}
  requestAnimationFrame(draw);})();
/* ===== Als de kijker een tijdje niets doet, wordt Sam even onrustig (denkt na, kijkt om zich heen) ===== */
let idleT=performance.now(),reacting=false,reactAbort=null;
const poke=()=>{idleT=performance.now();};
addEventListener('pointerdown',poke,{passive:true});addEventListener('keydown',poke);addEventListener('pointermove',poke,{passive:true});
function stopReact(){if(!reacting)return;reacting=false;if(reactAbort)reactAbort();reactAbort=null;show('idle',250);hide('think',250);try{vids.think.pause();}catch(e){}}
setInterval(async()=>{if(busy||!introSeen||phase!=='room')idleT=performance.now();   // de wachttijd telt pas als de kijker vrij is
  if(reacting||busy||!introSeen||phase!=='room'||document.hidden||done.size>=CHAPTERS.length)return;
  if($('card').classList.contains('show')||$('end').classList.contains('show'))return;
  if(performance.now()-idleT<15000)return;
  reacting=true;idleT=performance.now();
  const v=await start('think');if(!reacting)return;show('think',450);hide('idle',450);
  if(!muted&&actx)setTimeout(()=>{if(reacting)sfx('cloth');},400);
  await Promise.race([ended(v),new Promise(r=>{reactAbort=r;})]);
  if(reacting){reacting=false;reactAbort=null;show('idle',450);hide('think',450);idleT=performance.now();}},1000);
