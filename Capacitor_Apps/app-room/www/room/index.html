<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>We All Breathe the Same Air</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
  <link rel="stylesheet" href="shared/shared.css">
  <style>
    :root {
      --ink: #0d0c0b;
      --paper: #efe6d2;
      --dim: #a99f8a;
      --lamp: #f2c76b;
      --stamp: #c8332b;
      --veil: rgba(13, 12, 11, .72);
      --f-type: "Special Elite", "Courier New", monospace;
      --f-body: "Literata", Georgia, serif;
    }

    #wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--ink);
    }

    /* Invisible stage-aligned hit targets over the Three.js canvas for pointer, touch & keyboard focus */
    #hots {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      z-index: 4;
      pointer-events: none;
    }
    .hot {
      position: absolute;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      border-radius: 14px;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hot:focus-visible {
      outline: 3px dashed var(--lamp);
      outline-offset: 4px;
    }
    .hot[disabled], .hot.locked {
      cursor: default;
    }

    /* Cinematic dove fly-out interlude (Ch 4 ending) */
    #cine {
      position: fixed;
      inset: 0;
      background: #000;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .55s ease;
      z-index: 15;
    }
    #cine.on {
      opacity: 1;
    }
    #cine video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* UI layer (captions, Start card, End card, Portrait rotate notice) */
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    #caption {
      position: absolute;
      left: 50%;
      top: clamp(58px, 12vh, 120px);
      transform: translateX(-50%);
      width: max-content;
      max-width: min(88vw, 760px);
      text-align: center;
      font: italic 400 clamp(14px, 1.9vw, 25px)/1.35 var(--f-body);
      color: var(--paper);
      background: var(--veil);
      padding: .5em 1em;
      border-radius: 4px;
      opacity: 0;
      transition: opacity .4s;
    }
    #caption.show {
      opacity: 1;
    }

    .card {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: grid;
      place-items: center;
      text-align: center;
      background: rgba(10, 9, 8, .90);
      padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .7s ease, visibility .7s ease;
      overflow: auto;
    }
    .card.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #end.final {
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(10, 9, 8, .74), rgba(10, 9, 8, .36) 70%, rgba(10, 9, 8, .16));
      transition: opacity 2.8s ease, visibility 2.8s ease;
    }
    #end.final h2 {
      text-shadow: 0 2px 30px rgba(0, 0, 0, .85);
    }
    .card .k {
      font: clamp(11px, min(1.4vw, 2.6vh), 18px)/1.2 var(--f-type);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .card h1, .card h2 {
      font: 400 clamp(30px, min(6.4vw, 11vh), 92px)/1.05 var(--f-type);
      margin: .25em 0 0;
      text-wrap: balance;
      color: var(--paper);
    }
    .card p {
      font: 400 clamp(14px, min(1.8vw, 3.4vh), 22px)/1.5 var(--f-body);
      color: var(--dim);
      max-width: 34em;
      margin: .9em auto 0;
    }
    .card .rule {
      width: 80px;
      height: 3px;
      background: var(--stamp);
      margin: clamp(14px, 3vh, 28px) auto 0;
      transform: rotate(-2deg);
    }
    .card button.big, .card a.big {
      margin-top: clamp(16px, 4vh, 38px);
      font: clamp(15px, min(1.8vw, 3.4vh), 24px)/1 var(--f-type);
      color: var(--ink);
      background: var(--lamp);
      border: 0;
      padding: .8em 1.6em;
      border-radius: 4px;
      cursor: pointer;
      min-height: 44px;
      transition: filter .15s ease, opacity .2s ease, border-color .2s ease, color .2s ease;
      text-decoration: none;
      display: inline-block;
    }
    .card button.big:hover:not(:disabled), .card a.big:hover {
      filter: brightness(1.08);
    }
    .card a.big.ghost-link {
      background: transparent;
      color: var(--paper);
      border: 1px solid rgba(239, 230, 210, .35);
    }
    .card a.big.ghost-link:hover {
      border-color: var(--lamp);
      color: var(--lamp);
      filter: none;
    }
    .end-acts {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    #curtain {
      position: fixed;
      inset: 0;
      z-index: 45;
      background: #000;
      opacity: 1;
      pointer-events: none;
      transition: opacity 1.1s ease;
    }
    #curtain.off {
      opacity: 0;
    }
    .card button.big:disabled {
      opacity: .55;
      cursor: default;
    }
    .card button.big:focus-visible {
      outline: 3px solid var(--paper);
      outline-offset: 4px;
    }

    #loadbar {
      width: min(320px, 60vw);
      height: 4px;
      background: rgba(239, 230, 210, .15);
      margin: clamp(16px, 4vh, 32px) auto 0;
      border-radius: 3px;
      overflow: hidden;
    }
    #loadbar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--lamp);
      transition: width .2s;
    }

    @media (prefers-reduced-motion: reduce) {
      .card, #caption { transition: none; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas class="gl" id="gl" aria-label="Interactive room"></canvas>
    <div id="hots"></div>
  </div>

  <div id="cine" aria-hidden="true">
    <video id="cineV" muted playsinline preload="none"></video>
  </div>

  <div id="ui">
    <div id="caption" role="status" aria-live="polite"></div>
  </div>

  <div id="curtain" aria-hidden="true"></div>

  <div class="card" id="start">
    <div>
      <div class="k">A graphic novel in four chapters</div>
      <h1>We All Breathe<br>the Same Air</h1>
      <p>Every object in his room opens a chapter. Follow the small light.</p>
      <div id="loadbar"><span></span></div>
      <button class="big" id="startBtn" type="button" disabled>Loading&hellip;</button>
    </div>
  </div>

  <div class="card" id="end">
    <div>
      <div class="k">The End</div>
      <h2>We All Breathe<br>the Same Air</h2>
      <div class="rule"></div>
      <div class="end-acts">
        <button class="big" id="again" type="button">Start again</button>
        <a class="big ghost-link" id="backHome" href="../index.html">← Home</a>
      </div>
    </div>
  </div>

  <script src="shared/lib/three.min.js"></script>
  <script src="shared/shared.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
