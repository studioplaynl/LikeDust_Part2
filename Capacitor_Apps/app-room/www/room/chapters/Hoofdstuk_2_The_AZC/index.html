<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The AZC · We All Breathe the Same Air</title>
  <link rel="stylesheet" href="../../../fonts/fonts.css">
  <link rel="stylesheet" href="../../../i18n/i18n.css">
  <link rel="stylesheet" href="../../shared/chapter-engine.css">
</head>
<body>
  <div class="stage">
    <div class="frame" id="frame">
      <video id="vA" width="1280" height="720" playsinline webkit-playsinline preload="auto"></video>
      <video id="vB" width="1280" height="720" playsinline webkit-playsinline preload="auto" class="hide"></video>
      <div class="big" aria-live="polite"><span id="big"></span></div>
      <div class="ui" id="ui"></div>
    </div>
  </div>

  <div class="top">
    <span class="tools">
      <a class="ghost" id="toRoom" href="#" data-room>← Back to room</a>
      <span id="chapLang"></span>
      <button class="ghost" id="fs" type="button" hidden>⛶ Full screen</button>
    </span>
  </div>

  <div class="ctl" id="ctl">
    <button class="play" id="play" type="button" aria-label="Pause">❚❚</button>
    <div class="tl" id="tl">
      <div class="rail"></div>
      <div class="fill" id="fill"></div>
    </div>
    <span class="time" id="time">0:00 / 1:40</span>
    <button class="ghost cc" id="cc" type="button" aria-pressed="false" aria-label="Subtitles" hidden>
      <svg viewBox="0 0 32 24" aria-hidden="true">
        <rect x="2" y="2" width="28" height="20" rx="2.8" fill="none" stroke="currentColor" stroke-width="2.4" />
        <rect x="6" y="14.8" width="6.6" height="1.85" rx=".35" fill="currentColor" />
        <rect x="14.4" y="14.8" width="3.2" height="1.85" rx=".35" fill="currentColor" />
        <rect x="19.4" y="14.8" width="6.6" height="1.85" rx=".35" fill="currentColor" />
        <rect x="8.8" y="17.6" width="5.8" height="1.85" rx=".35" fill="currentColor" />
        <rect x="17.4" y="17.6" width="5.8" height="1.85" rx=".35" fill="currentColor" />
      </svg>
    </button>
  </div>

  <div class="card" id="cardStart">
    <p class="eyebrow" id="s_eye">We All Breathe The Same Air · Chapter two</p>
    <h1 class="h-title" id="s_title">The AZC</h1>
    <p class="place" id="s_place">The Netherlands</p>
    <button class="btn" id="go" type="button" data-t="s_play">▶ Play the chapter</button>
    <p class="eyebrow" style="font-size:.72rem" id="s_note">Sound on · 2 minutes · the film stops three times and waits for you</p>
  </div>

  <div class="card off" id="cardEnd">
    <p class="eyebrow" id="e_eye">End of chapter two</p>
    <h2 class="h-title" id="e_title">Years pass<br>between walls.</h2>
    <p class="endnum" id="endnum" hidden><span data-t="e_num">Your number:</span> <b id="endnumv"></b></p>
    <p class="place" id="e_next">Chapter three: Amsterdam</p>
    <div class="row">
      <a class="ghost" href="#" data-room>← Back to room</a>
      <button class="ghost" id="again" type="button" data-t="again">↺ Watch again</button>
    </div>
  </div>

  <script>window.CHAPTER_NUM = 2;</script>
  <script src="../../../i18n/i18n.js"></script>
  <script src="../../shared/chapter-engine.js"></script>
</body>
</html>
