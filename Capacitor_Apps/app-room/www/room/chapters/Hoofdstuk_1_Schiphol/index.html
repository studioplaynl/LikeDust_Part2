<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <style>
    html,
    body {
      margin: 0;
      background: #000
    }

    [hidden] {
      display: none !important
    }

    /* Video controls auto-hide; show on video pane click/tap; no chapter number top-left */
    .chap,
    #lang,
    #restart,
    a[href="comic.html"] {
      display: none !important
    }

    .top {
      justify-content: flex-end !important
    }

    .ctl,
    .top {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity .35s ease !important
    }

    body.show-ctl:not(.ld-wait) .ctl,
    body.show-ctl:not(.ld-wait) .top {
      opacity: 1 !important;
      pointer-events: auto !important
    }

    .ctl {
      background: linear-gradient(to top, rgba(0, 0, 0, .82), rgba(0, 0, 0, 0))
    }

    .ctl .cc {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 7px;
      border: 0;
      background: transparent;
      color: var(--chalk);
      opacity: .86;
      transition: color .2s, opacity .2s, filter .2s
    }

    .ctl .cc:hover,
    .ctl .cc[aria-pressed="true"] {
      color: var(--ochre);
      opacity: 1
    }

    .ctl .cc[aria-pressed="true"] {
      filter: drop-shadow(0 0 6px rgba(214, 169, 62, .45))
    }

    .ctl .cc svg {
      width: 30px;
      height: 22px;
      display: block
    }
  </style>
  <title>Schiphol Chapter One</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=Reenie+Beanie&family=Vazirmatn:wght@400;500&display=swap">
  <style>
    /* Layout: Sam's own chapter film fills the screen (16:9, never cropped). It stops at four moments; the viewer acts on the frozen frame, then the film runs on. Sam's own words are the only story text; UI copy stays small and functional. */
    :root {
      --ink: #000;
      --chalk: #ece8de;
      --chalk-dim: #a3a59e;
      --ochre: #D6A93E;
      --ochre-dim: #a8873a;
      --shade: rgba(0, 0, 0, .62);
      --stamp: #c0402c;
      --card: #e9c94a;
      --card-ink: #2a2412;
      --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --f-body: "Literata", Georgia, serif;
      --f-chalk: "Reenie Beanie", "Comic Sans MS", cursive;
      --f-sub: Arial, Helvetica, "Helvetica Neue", sans-serif;
      --f-fa: "Vazirmatn", Tahoma, sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
      background: var(--ink);
      color: var(--chalk);
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      overflow: hidden;
      font-family: var(--f-body)
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
      -webkit-user-select: none;
      user-select: none
    }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000
    }

    .frame {
      position: relative;
      width: min(100vw, calc((100vh - 112px) * 16 / 9));
      aspect-ratio: 16/9;
      max-width: 100%;
      overflow: hidden;
      background: #000;
      margin: 44px 0 56px
    }

    .frame video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000
    }

    .frame video.hide {
      visibility: hidden
    }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 4
    }

    .top {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: max(16px, env(safe-area-inset-left, 0px));
      right: max(16px, env(safe-area-inset-right, 0px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 20
    }

    .chap {
      font: 500 .75rem var(--f-display);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--chalk-dim)
    }

    .chap b {
      color: var(--ochre);
      font-weight: 700
    }

    .tools {
      display: flex;
      gap: 8px
    }

    .ghost {
      font: 700 .78rem var(--f-display);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--chalk);
      background: var(--shade);
      border: 1px solid rgba(236, 232, 222, .35);
      padding: 9px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block
    }

    .ghost:hover {
      border-color: var(--ochre);
      color: var(--ochre)
    }

    .ghost[aria-pressed="true"] {
      border-color: var(--ochre);
      color: var(--ochre)
    }

    .btn {
      font: 700 1rem var(--f-display);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #000;
      background: var(--chalk);
      border: 0;
      padding: 14px 30px;
      cursor: pointer
    }

    .btn:hover {
      background: var(--ochre)
    }

    .btn:focus-visible,
    .ghost:focus-visible,
    .hold:focus-visible,
    .play:focus-visible {
      outline: 2px solid var(--ochre);
      outline-offset: 4px
    }

    /* controls */
    .ctl {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))
    }

    .play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(236, 232, 222, .4);
      background: var(--shade);
      color: var(--chalk);
      cursor: pointer;
      font-size: .9rem;
      flex: 0 0 auto
    }

    .tl {
      position: relative;
      flex: 1 1 auto;
      height: 22px;
      min-width: 0
    }

    .tl .rail {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 2px;
      background: rgba(236, 232, 222, .2)
    }

    .tl .fill {
      position: absolute;
      left: 0;
      top: 10px;
      height: 2px;
      background: var(--ochre);
      width: 0
    }

    .tl .mk {
      position: absolute;
      top: 4px;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      border: 2px solid var(--ochre);
      background: #000;
      cursor: pointer;
      padding: 0
    }

    .tl .mk.done {
      background: var(--ochre)
    }

    .tl .mk span {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font: 600 .62rem var(--f-display);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--chalk-dim);
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none
    }

    .tl .mk:hover span,
    .tl .mk:focus-visible span {
      opacity: 1
    }

    .time {
      font: 600 .78rem var(--f-display);
      letter-spacing: .12em;
      color: var(--chalk-dim);
      font-variant-numeric: tabular-nums;
      flex: 0 0 auto
    }

    .cc {
      flex: 0 0 auto;
      padding: 7px 10px
    }

    /* large text: the same words as in the film, bigger */
    .big {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      pointer-events: none
    }

    .big span {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 1.2% 6% 1.6%;
      background: rgba(0, 0, 0, .86);
      font: 700 clamp(1rem, 2.6vw, 2rem)/1.3 var(--f-sub);
      color: var(--ochre);
      text-align: center;
      text-wrap: balance;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 10px rgba(0, 0, 0, .95);
      opacity: 0;
      transition: opacity .25s
    }

    .big span.on {
      opacity: 1
    }

    /* cards */
    .card {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 22px;
      text-align: center;
      background: #000;
      padding-inline: 16px;
      transition: opacity 1s
    }

    .card.off {
      opacity: 0;
      pointer-events: none
    }

    .eyebrow {
      margin: 0;
      font: 500 .85rem var(--f-display);
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--ochre-dim)
    }

    .h-title {
      margin: 0;
      color: var(--ochre);
      font: 800 clamp(2.4rem, 8vw, 6rem)/.9 var(--f-display);
      text-transform: uppercase;
      text-wrap: balance
    }

    .place {
      margin: 0;
      font-style: italic;
      color: var(--chalk-dim);
      font-size: 1.1rem
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center
    }

    .endnum {
      font: 600 .9rem var(--f-display);
      letter-spacing: .2em;
      color: var(--chalk-dim)
    }

    .endnum b {
      color: var(--card);
      font-weight: 700
    }

    .toast {
      position: fixed;
      left: 50%;
      top: calc(60px + env(safe-area-inset-top, 0px));
      transform: translateX(-50%);
      z-index: 40;
      font: 600 .74rem var(--f-display);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--chalk);
      background: rgba(0, 0, 0, .85);
      border: 1px solid var(--ochre);
      padding: 9px 14px
    }

    /* touch: no double-tap zoom delay, a clear pressed state, bigger targets on phones */
    .phone,
    .hold,
    .door,
    .skip,
    .btn,
    .ghost,
    .shoot {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent
    }

    .phone .rc {
      display: block;
      margin-top: 4px;
      font-size: .85em;
      color: var(--ochre)
    }

    @media (pointer:coarse) {

      .phone,
      .hold {
        width: clamp(104px, 22%, 150px)
      }

      .door {
        width: clamp(150px, 26%, 230px)
      }

      .skip {
        padding: 10px 14px;
        font-size: .72rem
      }

      .ask {
        font-size: .72rem;
        padding: 8px 12px
      }
    }

    /* interaction chrome */
    .ask {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 4%;
      z-index: 7;
      text-align: center;
      font: 600 clamp(.66rem, 1.2vw, .85rem) var(--f-display);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ochre);
      background: rgba(0, 0, 0, .65);
      padding: 7px 14px;
      max-width: 92%
    }

    .voice {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 13%;
      z-index: 7;
      width: min(80%, 46ch);
      text-align: center;
      pointer-events: none
    }

    .voice p {
      margin: 0;
      display: inline;
      font: 400 clamp(1rem, 2vw, 1.5rem)/1.6 var(--f-body);
      font-style: italic;
      color: var(--chalk);
      background: rgba(0, 0, 0, .72);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      padding: 2px 10px;
      text-shadow: none
    }

    .voice p .w {
      opacity: 0;
      transition: opacity .5s
    }

    .voice p .w.on {
      opacity: 1
    }

    .voice .fa {
      direction: rtl;
      font: 400 clamp(.95rem, 1.7vw, 1.3rem)/1.7 var(--f-fa);
      font-style: normal;
      color: var(--chalk-dim);
      margin-top: 6px;
      opacity: 0;
      transition: opacity 1.2s
    }

    .voice .fa.on {
      opacity: 1
    }

    .skip {
      display: none !important
    }

    .readout {
      position: absolute;
      left: 50%;
      top: 76%;
      transform: translateX(-50%);
      z-index: 7;
      font: 700 clamp(.8rem, 1.4vw, 1rem) var(--f-display);
      letter-spacing: .18em;
      color: var(--chalk);
      background: rgba(0, 0, 0, .6);
      padding: 4px 10px;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transition: opacity .4s
    }

    .readout.on {
      opacity: 1
    }

    .vig {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse at 50% 58%, transparent calc(62% - var(--v, 0)*50%), #000 calc(96% - var(--v, 0)*38%))
    }

    .hold {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: clamp(84px, 12%, 140px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 0;
      background: rgba(0, 0, 0, .45);
      cursor: pointer;
      display: grid;
      place-items: center;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      z-index: 5;
      touch-action: none
    }

    .hold svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg)
    }

    .hold .lbl {
      font: 700 clamp(.6rem, 1.1vw, .82rem)/1.2 var(--f-display);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--chalk);
      text-shadow: 0 1px 6px #000;
      text-align: center
    }

    .hold.pulse circle.base {
      animation: ring 2.4s ease-in-out infinite
    }

    @keyframes ring {

      0%,
      100% {
        stroke-opacity: .35
      }

      50% {
        stroke-opacity: .95
      }
    }

    .stamp {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%) rotate(-12deg) scale(2.4);
      z-index: 6;
      font: 800 clamp(1.6rem, 5vw, 3.8rem) var(--f-display);
      letter-spacing: .08em;
      color: var(--stamp);
      border: 5px solid var(--stamp);
      padding: 2px 18px;
      opacity: 0;
      transition: transform .18s cubic-bezier(.3, 1.6, .6, 1), opacity .1s;
      pointer-events: none
    }

    .stamp.on {
      opacity: .95;
      transform: translate(-50%, -50%) rotate(-12deg) scale(1)
    }

    .shake {
      animation: shake .35s
    }

    @keyframes shake {
      20% {
        transform: translate(-6px, 3px)
      }

      40% {
        transform: translate(5px, -4px)
      }

      60% {
        transform: translate(-3px, 2px)
      }

      80% {
        transform: translate(2px, -1px)
      }
    }

    .dim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .84);
      z-index: 3;
      opacity: 0;
      transition: opacity 1s
    }

    .dim.on {
      opacity: 1
    }

    .wallbox {
      position: absolute;
      top: 3%;
      bottom: 3%;
      left: 50%;
      transform: translateX(-50%);
      aspect-ratio: 1139/1695;
      z-index: 5;
      box-shadow: 0 10px 60px #000;
      opacity: 0;
      transition: opacity 1.2s;
      overflow: hidden
    }

    .wallbox.on {
      opacity: 1
    }

    .wallbox img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .wallbox .lines {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .wallbox canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none
    }

    .scratch {
      position: absolute;
      font: clamp(.8rem, 1.5vw, 1.3rem)/1 var(--f-chalk);
      color: rgba(236, 232, 222, .78);
      white-space: nowrap;
      pointer-events: none
    }

    .scratch.mine {
      left: 50%;
      top: 6.5%;
      transform: translateX(-50%) rotate(-3deg);
      width: 88%;
      white-space: normal;
      text-align: center;
      color: rgba(255, 246, 220, .98);
      font-size: 28px;
      line-height: 1.05;
      text-shadow: 0 0 10px rgba(255, 240, 200, .35);
      opacity: 0;
      transition: opacity 2.4s
    }

    .scratch.mine.on {
      opacity: 1
    }

    .wallcount {
      position: absolute;
      left: 50%;
      top: 1.5%;
      transform: translateX(-50%);
      z-index: 8;
      font: 600 .68rem var(--f-display);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--chalk-dim);
      background: rgba(0, 0, 0, .6);
      padding: 4px 10px;
      opacity: 0;
      transition: opacity .8s;
      white-space: nowrap
    }

    .wallcount.on {
      opacity: 1
    }

    .write {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      z-index: 9;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: min(92%, 520px);
      background: rgba(0, 0, 0, .82);
      padding: 12px
    }

    .write p {
      flex-basis: 100%;
      margin: 0;
      text-align: center;
      font: 600 .72rem var(--f-display);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ochre)
    }

    .write small {
      flex-basis: 100%;
      text-align: center;
      font-size: .72rem;
      color: var(--chalk-dim)
    }

    .write input {
      flex: 1 1 180px;
      min-width: 0;
      font: 1.5rem var(--f-chalk);
      color: var(--chalk);
      background: #111;
      border: 1px solid rgba(236, 232, 222, .35);
      padding: 4px 10px
    }

    .write input:focus {
      outline: 2px solid var(--ochre)
    }

    .finder {
      position: absolute;
      inset: 6% 22%;
      z-index: 5;
      pointer-events: none;
      transition: opacity .4s
    }

    .finder i {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px solid var(--chalk)
    }

    .finder i:nth-child(1) {
      left: 0;
      top: 0;
      border-right: 0;
      border-bottom: 0
    }

    .finder i:nth-child(2) {
      right: 0;
      top: 0;
      border-left: 0;
      border-bottom: 0
    }

    .finder i:nth-child(3) {
      left: 0;
      bottom: 0;
      border-right: 0;
      border-top: 0
    }

    .finder i:nth-child(4) {
      right: 0;
      bottom: 0;
      border-left: 0;
      border-top: 0
    }

    .finder span {
      position: absolute;
      top: 8px;
      left: 40px;
      font: 600 .72rem var(--f-display);
      letter-spacing: .2em;
      color: var(--stamp)
    }

    .shoot {
      position: absolute;
      inset: 0;
      z-index: 6;
      background: transparent;
      border: 0;
      cursor: pointer
    }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      z-index: 9;
      pointer-events: none
    }

    .flash.go {
      animation: flash 1.1s ease-out
    }

    @keyframes flash {
      0% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .gray video {
      filter: grayscale(1) brightness(.6);
      transition: filter .3s
    }

    /* the yellow card (an illustration inside the story, not a real document) */
    .ycard {
      position: absolute;
      left: 50%;
      top: 39%;
      z-index: 8;
      width: min(46%, 420px);
      aspect-ratio: 85.6/54;
      background: var(--card);
      color: var(--card-ink);
      border-radius: 10px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .8);
      display: grid;
      grid-template-columns: 34% 1fr;
      gap: 6%;
      padding: 5%;
      transform: translate(-50%, -50%) rotate(-3deg) scale(.6);
      opacity: 0;
      transition: transform .8s cubic-bezier(.2, 1.2, .4, 1), opacity .5s
    }

    .ycard.on {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(-3deg) scale(1)
    }

    .ycard canvas {
      width: 100%;
      aspect-ratio: 3/4;
      background: #333;
      border: 2px solid rgba(42, 36, 18, .5);
      filter: grayscale(1) contrast(1.1)
    }

    .ycard .info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0
    }

    .ycard .lab {
      font: 600 clamp(.45rem, .9vw, .65rem) var(--f-display);
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .7
    }

    .ycard .name {
      font: 700 clamp(.8rem, 1.6vw, 1.2rem) var(--f-display);
      letter-spacing: .06em;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      opacity: .55
    }

    .ycard .num {
      white-space: nowrap;
      font: 800 clamp(.95rem, 2.4vw, 2rem) var(--f-display);
      letter-spacing: .08em;
      font-variant-numeric: tabular-nums
    }

    /* the interrogation: what you answer is crossed out */
    .answer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 7;
      width: min(70%, 520px);
      display: flex;
      flex-direction: column;
      gap: 10px;

      const spans = [...p.children]; const step = () => { if (i < spans.length) { spans[i++].classList.add("on"); later(step, 260 + Math.min(260, spans[i - 1].textContent.length * 22)); } else if (fa) { const f = document.createElement("div"); f.className = "fa"; f.lang = "fa"; f.textContent = fa; box.appendChild(f); requestAnimationFrame(() => f.classList.add("on")); } };
      step();
      return words.length * 380 + (fa ? 1200 : 0);
    }
    function skipBtn() { /* Skip button removed from interactive videos */ }

    /* ---------- viewer's number for the yellow card (kept per viewer for chapter two) ---------- */
    function myNumber(make) {
      let n = null; try { n = localStorage.getItem("wabtsa-number"); if (n && n.startsWith("V-1999-")) { n = n.replace("V-1999-", "V-1997-"); localStorage.setItem("wabtsa-number", n); } } catch (_) { }
      if (!n && make) { n = "V-1997-" + String(Math.floor(1000 + Math.random() * 8999)); try { localStorage.setItem("wabtsa-number", n); } catch (_) { } }
      return n;
    }

    /* ---------- shared wall: every viewer's line stays ---------- */
    const wallStore = (() => {
      let db = null, user = null, myId = null, lines = [], listeners = new Set(), canWrite = null, started = false;
      async function start() {
        if (started) return; started = true;
        try { db = await window.claude?.use?.("db"); user = await window.claude?.use?.("user"); } catch (_) { db = null; }
        if (!db) return;
        try { myId = user ? await user.id() : null; } catch (_) { }
        try { canWrite = user ? await user.can("data.write") : null; } catch (_) { }
        db.collection("wall").orderBy("at", "desc").limit(120).onSnapshot(s => { lines = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => typeof x.text === "string"); listeners.forEach(f => f(lines)); }, () => { });
      }
      async function add(text) {
        if (!db || !myId || canWrite === false) return false;
        try { await db.doc("wall/" + myId).set({ text: text.slice(0, 34), at: Date.now() }); return true; } catch (_) { canWrite = false; return false; }
      }
      return { start, add, on(f) { listeners.add(f); f(lines); return () => listeners.delete(f); }, get lines() { return lines; }, get myId() { return myId; } };
    })();
    wallStore.start();

    /* deterministic spot for a line on the wall, from its id */
    function spotFor(id) {
      let h = 2166136261; for (const c of id) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
      const r = k => ((h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0) % 1000) / 1000;
      /* other viewers' lines go only on the bare parts of the wall, never over the drawn writing */
      const Z = [[8, 52, 14, 4], [52, 28, 53, 4], [4, 22, 77, 9]], z = Z[Math.floor(r() * Z.length)];
      return { x: z[0] + r() * z[1], y: z[2] + r() * z[3], rot: -7 + r() * 10 };
    }

    /* ---------- the four moments ---------- */
    const INTERACT = {

      /* 1 · HOLD YOUR BREATH — no winning, no losing: the stamp comes anyway */
      breath() {
        const MAX = 12, C = 2 * Math.PI * 46;
        ui.insertAdjacentHTML("beforeend", `<div class="vig" id="vig"></div>
   <button class="hold pulse" id="hold" type="button" aria-label="${t("b_aria")}">
    <svg viewBox="0 0 100 100"><circle class="base" cx="50" cy="50" r="46" fill="none" stroke="#ece8de" stroke-width="2"/><circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="#D6A93E" stroke-width="5" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
    <span class="lbl" id="hl">${t("b_lbl")}</span></button>
   <div class="readout" id="ro"></div>
   <div class="stamp" id="stamp">${t("b_stamp")}</div>
   <div class="ask" id="ask">${t("b_ask")}</div>`);
        const btn = $("hold"), arc = $("arc"), vig = $("vig"), ro = $("ro");
        let held = 0, holding = false, raf = 0, last = performance.now(), done = false;
        function loop(t) {
          const dt = (t - last) / 1000; last = t;
          if (holding) { held = Math.min(MAX, held + dt); const p = held / MAX; arc.style.strokeDashoffset = C * (1 - p); vig.style.setProperty("--v", p); snd.rate(70 + p * 80); ro.textContent = held.toFixed(1) + " s"; ro.classList.add("on"); if (held >= MAX) return finish(); }
          raf = requestAnimationFrame(loop);
        }
        function down(e) { if (done || holding) return; e.preventDefault(); holding = true; btn.classList.remove("pulse"); $("hl").textContent = "…"; $("ask").hidden = true; snd.heart(true, 70); }
        function up() { if (done || !holding) return; finish(); }
        function finish() {
          done = true; holding = false; snd.heart(false); snd.exhale(); cancelAnimationFrame(raf); btn.hidden = true;
          ro.textContent = t("b_held", held.toFixed(1).replace(".", LANG === "nl" ? "," : "."));
          later(() => { $("stamp").classList.add("on"); snd.stamp(); frame.classList.add("shake"); later(() => frame.classList.remove("shake"), 400); }, 700);
          later(() => { vig.style.setProperty("--v", 0); next(); }, 3400);
        }
        const offHold = holdable(btn, down, up);
        const kd = e => { if (e.code === "Space" && !e.repeat) { down(e); } }, ku = e => { if (e.code === "Space") up(); };
        addEventListener("keydown", kd); addEventListener("keyup", ku);
        raf = requestAnimationFrame(loop);
        cleanup = () => { cancelAnimationFrame(raf); snd.heart(false); offHold(); removeEventListener("keydown", kd); removeEventListener("keyup", ku); };
      },

      /* · THE INTERROGATION — whatever you answer is crossed out; silence is the only safe answer */
      silence() {
        ui.insertAdjacentHTML("beforeend", `<div class="dim on" style="background:rgba(0,0,0,.55)"></div>
    <form class="answer" id="af"><label for="ans">${t("q_label")}</label>
    <textarea id="ans" maxlength="160" placeholder="${t("q_ph")}" autocomplete="off"></textarea>
    <div class="acts"><button class="btn" type="submit">${t("q_answer")}</button><button class="ghost" id="quiet" type="button">${t("q_quiet")}</button></div></form>`);
        const ta = $("ans"); if (!matchMedia("(pointer:coarse)").matches) ta.focus({ preventScroll: true });
        let idle = later(() => finish(""), 25000);
        ta.addEventListener("input", () => { clearTimeout(idle); timers.delete(idle); idle = later(() => finish(ta.value), 25000); });
        $("quiet").onclick = () => finish("");
        $("af").onsubmit = e => { e.preventDefault(); finish(ta.value); };
        let done = false;
        function finish(text) {
          if (done) return; done = true; text = text.trim(); $("af").remove();
          if (!text) { later(next, 600); return; }
          const box = document.createElement("div"); box.className = "said"; ui.appendChild(box);
          [...text].forEach(ch => { const s = document.createElement("span"); s.className = "c"; s.textContent = ch; box.appendChild(s); });
          const cs = [...box.children]; const per = Math.max(18, Math.min(60, 2600 / cs.length));
          cs.forEach((c, i) => later(() => { c.classList.add("x"); if (i % 4 === 0) snd.scrape(); }, 500 + i * per));
          later(() => box.classList.add("gone"), 900 + cs.length * per + 600);
          later(next, 900 + cs.length * per + 2200);
        }
      },

      /* 2 · THE CELL WALL — page 10 of the book; every viewer's line stays on it */
      wall() {
        ui.insertAdjacentHTML("beforeend", `<div class="dim" id="dim"></div>
    <div class="wallbox" id="wb"><img src="pages/p10.jpg" alt="${t("w_alt")}"><div class="lines" id="wl"></div><canvas id="cv" aria-label="${t("w_canvas")}"></canvas></div>
    <div class="wallcount" id="wc"></div>
    <div class="ask" id="ask">${t("w_ask")}</div>`);
        requestAnimationFrame(() => { $("dim").classList.add("on"); $("wb").classList.add("on"); });
        voice(t("w_v1"), "دیوارها حرف می‌زدند. داستان‌های خامی که هرگز پایانشان را نمی‌دانستم.");
        const wb = $("wb"), wl = $("wl"), cv = $("cv"), ctx = cv.getContext("2d");
        function drawLines(lines) {
          const keep = wl.querySelector(".mine"); wl.textContent = ""; if (keep) wl.appendChild(keep); lines.forEach(l => {
            if (l.id === wallStore.myId && keep) return; const s = spotFor(l.id); const d = document.createElement("div"); d.className = "scratch"; d.textContent = l.text;
            d.style.left = s.x + "%"; d.style.top = s.y + "%"; d.style.transform = `rotate(${s.rot}deg)`; wl.appendChild(d);
          });
          const n = lines.length; const wc = $("wc"); if (wc) wc.textContent = n ? t("w_count", n) : "";
        }
        const off = wallStore.on(drawLines);
        let ready = false, downP = false, lastP = null, revealed = false, moves = 0, brush = 30;
        later(() => {
          const r = wb.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
          cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr); brush = Math.max(24, r.width * .1);
          ctx.fillStyle = "#0b0c0b"; ctx.fillRect(0, 0, r.width, r.height);
          for (let k = 0; k < 2200; k++) { ctx.fillStyle = `rgba(${38 + Math.random() * 30 | 0},${38 + Math.random() * 28 | 0},${34 + Math.random() * 20 | 0},${Math.random() * .5})`; const z = Math.random() * 14; ctx.fillRect(Math.random() * r.width, Math.random() * r.height, z, z * .6); }
          ctx.globalCompositeOperation = "destination-out"; ready = true;
        }, 60);
        function rub(x, y) { if (!ready) return; ctx.lineCap = "round"; ctx.lineWidth = brush; ctx.beginPath(); ctx.moveTo(lastP ? lastP[0] : x, lastP ? lastP[1] : y); ctx.lineTo(x, y); ctx.stroke(); lastP = [x, y]; if (++moves % 6 === 0) snd.scrape(); if (moves % 20 === 0) check(); }
        const pos = e => { const q = cv.getBoundingClientRect(); return [e.clientX - q.left, e.clientY - q.top]; };
        cv.onpointerdown = e => { downP = true; lastP = null; cv.setPointerCapture(e.pointerId); rub(...pos(e)); };
        cv.onpointermove = e => { if (downP) rub(...pos(e)); };
        cv.onpointerup = cv.onpointercancel = () => { downP = false; lastP = null; };
        function check() { if (revealed) return; const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let c = 0, n = 0; for (let k = 3; k < d.length; k += 4 * 97) { n++; if (d[k] < 40) c++; } if (c / n > .45) reveal(); }
        function reveal() {
          revealed = true; cv.style.transition = "opacity 1.6s"; cv.style.opacity = 0; cv.style.pointerEvents = "none"; $("ask").hidden = true; $("wc").classList.add("on");
          const ms = voice(t("w_v2"), "هر جمله را خواندم و به هر داستان گوش دادم.");
          later(() => {
            const box = ui.querySelector(".voice"); if (box) box.remove();
            ui.insertAdjacentHTML("beforeend", `<form class="write" id="wf"><p>${t("w_q")}</p><input id="wline" maxlength="34" autocomplete="off" placeholder="${t("w_ph")}" aria-label="${t("w_line")}"><button class="btn" type="submit">${t("w_btn")}</button><small>${t("w_note")}</small></form>`);
            $("wf").onsubmit = async e => {
              e.preventDefault(); const line = $("wline").value.trim(); if (!line) { $("wline").focus(); return; } $("wf").remove();
              const me = wallStore.myId || "me-" + Date.now(); const s = spotFor(me);
              const a = document.createElement("div"); a.className = "scratch mine"; a.textContent = line; a.style.fontSize = Math.min(46, Math.max(18, wb.clientWidth * 0.1)) + "px"; wl.appendChild(a);   /* your own line: big, on the empty top of the wall */
              for (let k = 0; k < 8; k++) later(snd.scrape, k * 120); requestAnimationFrame(() => a.classList.add("on"));
              const saved = await wallStore.add(line);
              if (!saved) { const wc = $("wc"); if (wc) wc.textContent = t("w_fail"); }
              later(next, 4200);
            };
            if (!matchMedia("(pointer:coarse)").matches) $("wline").focus({ preventScroll: true });
          }, Math.max(2600, ms));
        }
        cleanup = () => off();
      },

      /* 3 · MOTHER — hold to call home; it rings, nobody answers */
      mother() {
        ui.insertAdjacentHTML("beforeend", `<button class="phone" id="ph" type="button" aria-label="${t("ph_aria")}">${t("ph_hold")}</button>
    <div class="ask" id="ask">${t("ph_ask")}</div>`);
        voice("", "مادر…");
        const ph = $("ph"); let calling = false, rings = 0, done = false;
        onTap(ph, () => { if (done) return; if (!calling) { calling = true; snd.unlock(); ph.classList.add("ringing"); ph.innerHTML = t("ph_calling"); $("ask").textContent = t("ph_hang"); snd.ring(true, () => { rings++; ph.innerHTML = t("ph_calling") + `<span class="rc">${rings}</span>`; if (navigator.vibrate) try { navigator.vibrate(120); } catch (_) { } if (rings >= 4) later(stop, 1800); }); } else stop(); });
        function stop() { if (done) return; done = true; calling = false; snd.ring(false); ph.classList.remove("ringing"); ph.innerHTML = rings ? t("ph_rings", rings) : t("ph_none"); $("ask").hidden = true; later(next, 2400); }
        cleanup = () => { snd.ring(false); };
      },

      /* 4 · THE PHOTO — the viewer takes it; the yellow card shows a number for a name */
      photo() {
        frame.classList.add("gray");
        ui.insertAdjacentHTML("beforeend", `<div class="finder" id="fd"><i></i><i></i><i></i><i></i><span>● REC</span></div>
    <button class="shoot" id="shoot" type="button" aria-label="${t("f_aria")}"></button><div class="flash" id="fl"></div>
    <div class="ask" id="ask">${t("f_ask")}</div>`);
        onTap($("shoot"), () => {
          $("shoot").remove(); $("ask").hidden = true; snd.shutter(); $("fl").classList.add("go"); frame.classList.remove("gray"); $("fd").style.opacity = 0;
          const num = myNumber(true);
          ui.insertAdjacentHTML("beforeend", `<div class="ycard" id="yc" role="img" aria-label="${t("y_aria", num)}"><canvas id="ycp" width="300" height="400"></canvas>
      <div class="info"><div><div class="lab">${t("y_name")}</div><div class="name">Sam</div></div><div><div class="lab">${t("y_num")}</div><div class="num">${num}</div></div></div></div>`);
          const drawPhoto = () => { try { const c = $("ycp").getContext("2d"), vv = v(), vw = vv.videoWidth || 1280, vh = vv.videoHeight || 720; const sw = vh * 0.75, sx = (vw - sw) / 2; c.drawImage(vv, sx, 0, sw, vh, 0, 0, 300, 400); } catch (_) { } };
          if (v().readyState >= 2 && !v().seeking) drawPhoto(); else v().addEventListener("seeked", drawPhoto, { once: true });
          later(() => $("yc").classList.add("on"), 900);
          later(() => voice(t("f_v")), 1500);
          later(next, 10500);
        });
      }
    };
  </script>
  <script>/* ============================================================
VANUIT DE KAMER (iframe)
?embed=1 : geen startkaart, het eerste filmbeeld staat klaar. De kamer roept
ldPrime() aan op het moment van de klik (dan mag de browser geluid afspelen)
en ldStart() zodra de overgang klaar is. Via file:// gaat het met postMessage.
?autoplay=1 : meteen starten.
Los geopend gedraagt het hoofdstuk zich als vanouds.
============================================================ */
    (function () {
      const q = location.search, inRoom = window.parent !== window;
      if (inRoom) {
        const tr = $("toRoom"); if (tr) tr.style.display = "none";
        document.querySelectorAll("[data-room]").forEach(a => { const b = a.cloneNode(true); a.replaceWith(b); b.addEventListener("click", e => { e.preventDefault(); parent.postMessage("ld-room-back", "*"); }); });
        // aan het eind geen eindkaart: meteen terug naar de kamer
        const ce = $("cardEnd"); ce.style.display = "none"; let back = false;
        new MutationObserver(() => { if (!back && !ce.classList.contains("off")) { back = true; parent.postMessage("ld-room-back", "*"); } }).observe(ce, { attributes: true, attributeFilter: ["class"] });
      }
      ["pointerdown", "pointermove", "touchstart", "touchend", "keydown", "click"].forEach(ev => {
        addEventListener(ev, () => {
          vids.forEach(v => { if (v.muted) { v.muted = false; v.volume = 1; } });
          try { snd.unlock(); } catch (_) { }
        }, { passive: true });
      });
      function start() {
        $("cardStart").classList.add("off"); document.body.classList.remove("ld-wait");
        vids.forEach(v => { v.muted = false; v.volume = 1; });
        vids[0].currentTime = 0;
        vids[0].play().then(() => setPlaying(true)).catch(() => {
          vids.forEach(v => v.muted = true);
          vids[0].play().then(() => setPlaying(true)).catch(() => { $("cardStart").classList.remove("off"); });
        });
        preload(1);
      }
      if (/[?&]embed\b/.test(q)) {
        $("cardStart").classList.add("off"); document.body.classList.add("ld-wait");
        const st = document.createElement("style"); st.textContent = ".ld-wait .top,.ld-wait .ctl{opacity:0;pointer-events:none}.top,.ctl{transition:opacity .8s}"; document.head.appendChild(st);
        segI = 0; cur = 0; vids[0].preload = "auto"; vids[0].src = SEGS[0].src; vids[0].classList.remove("hide"); vids[1].classList.add("hide");
        let primed = false;
        window.ldPrime = () => {
          try { snd.unlock(); } catch (_) { }
          if (primed || !document.body.classList.contains("ld-wait")) return;
          primed = true;
          vids.forEach(v => { try { v.muted = false; v.volume = 1; const p = v.play(); if (p && p.catch) p.catch(() => { }); v.pause(); } catch (_) { } });
        };
        window.ldStart = start;
        addEventListener("message", e => { if (e.data === "ld-prime") ldPrime(); if (e.data === "ld-start") start(); if (e.data === "ld-pause") vids.forEach(v => v.pause()); });
        parent.postMessage("ld-ready", "*");
      } else if (/[?&]autoplay\b/.test(q)) { try { snd.unlock(); } catch (_) { } vids[0].src = SEGS[0].src; segI = 0; cur = 0; vids[0].classList.remove("hide"); vids[1].classList.add("hide"); start(); }
    })();
  </script>
