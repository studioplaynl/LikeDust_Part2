<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>We All Breathe The Same Air</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="We All Breathe The Same Air: interactive intro to the graphic novel by Sam Yazdanpanna.">
  <meta property="og:title" content="We All Breathe The Same Air">
  <meta property="og:description" content="We All Breathe The Same Air: interactive intro to the graphic novel by Sam Yazdanpanna.">
  <meta property="og:image" content="img/reflect.jpg">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../i18n/i18n.css">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --ink: #000;
      --chalk: #ece8de;
      --chalk-dim: #a3a59e;
      --ochre: #D6A93E;
      --shade: rgba(0, 0, 0, .62);
      --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --f-body: "Literata", Georgia, serif;
      --f-sub: Arial, Helvetica, "Helvetica Neue", sans-serif;
      color-scheme: dark;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--ink);
      color: var(--chalk);
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      overflow: hidden;
      font-family: var(--f-body);
    }
    img { max-width: 100%; -webkit-user-drag: none; user-select: none; }
    [hidden] { display: none !important; }
    .stage { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
    .screen { position: absolute; inset: 0; opacity: 1; visibility: visible; transition: opacity 1.2s ease, visibility 0s linear 0s; }
    .screen.off { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 1.2s ease, visibility 0s linear 1.2s; }
    .stage.instant .screen, .stage.instant .screen.off { transition: none !important; }
    .ghost {
      font: 700 .78rem var(--f-display);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--chalk);
      background: var(--shade);
      border: 1px solid rgba(236, 232, 222, .35);
      padding: 9px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .ghost:hover, .ghost[aria-pressed="true"] { border-color: var(--ochre); color: var(--ochre); }
    .ghost:focus-visible, .play:focus-visible { outline: 2px solid var(--ochre); outline-offset: 4px; }
    #young, #young:focus, #young:focus-visible { outline: none; -webkit-tap-highlight-color: transparent; }

    #intro { background: #000; display: grid; place-items: center; }
    #introFrame, .wrap {
      position: relative;
      width: min(100%, calc(100dvh * 16 / 9));
      height: min(100%, calc(100dvw * 9 / 16));
      aspect-ratio: 16/9;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    #intro video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity .7s ease;
    }
    #intro video.on { opacity: 1; }
    .big { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: center; pointer-events: none; }
    .big span {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 1.2% 6% 1.6%;
      background: rgba(0, 0, 0, .86);
      font: 700 clamp(.95rem, 2.4vw, 1.85rem)/1.35 var(--f-sub);
      color: var(--ochre);
      text-align: center;
      text-wrap: balance;
      opacity: 0;
      transition: opacity .15s linear;
    }
    .big span.on { opacity: 1; }

    .top {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: max(16px, env(safe-area-inset-left, 0px));
      right: max(16px, env(safe-area-inset-right, 0px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .ctl {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      background: linear-gradient(to top, rgba(0, 0, 0, .82), rgba(0, 0, 0, 0));
    }
    .ctl, .top { opacity: 0 !important; pointer-events: none !important; transition: opacity .35s ease !important; }
    body.show-ctl #intro:not(.off) .ctl, body.show-ctl #intro:not(.off) .top { opacity: 1 !important; pointer-events: auto !important; }
    .play {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(236, 232, 222, .4);
      background: var(--shade); color: var(--chalk);
      cursor: pointer; font-size: .9rem; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .play:hover { border-color: var(--ochre); color: var(--ochre); }
    .tl { position: relative; flex: 1 1 auto; height: 22px; min-width: 0; cursor: pointer; touch-action: none; }
    .tl .rail { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: rgba(236, 232, 222, .2); }
    .tl .fill { position: absolute; left: 0; top: 10px; height: 2px; background: var(--ochre); width: 0; }
    .time { font: 600 .78rem var(--f-display); letter-spacing: .12em; color: var(--chalk-dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .cc { display: inline-flex; align-items: center; justify-content: center; padding: 5px 7px; border: 0; background: transparent; color: var(--chalk); opacity: .86; cursor: pointer; flex: 0 0 auto; transition: color .2s, opacity .2s, filter .2s; }
    .cc:hover, .cc[aria-pressed="true"] { color: var(--ochre); opacity: 1; }
    .cc[aria-pressed="true"] { filter: drop-shadow(0 0 6px rgba(214, 169, 62, .45)); }
    .cc svg { width: 30px; height: 22px; display: block; }

    #scene { display: grid; place-items: center; }
    .zoom { position: absolute; inset: 0; animation: breathe 12s ease-in-out infinite; transform-origin: 68% 40%; will-change: transform; backface-visibility: hidden; }
    .zoom > img.bgimg { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    #young { position: absolute; left: 48%; top: 0; width: 46%; height: 96%; border: 0; background: transparent; cursor: pointer; border-radius: 45% 45% 10% 10%; z-index: 2; }
    .sil { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .90; will-change: opacity; backface-visibility: hidden; }
    .wrap.chosen .sil { opacity: 0 !important; transition: opacity .32s ease-out !important; }
    .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, calc(10px + env(safe-area-inset-bottom, 0px))); z-index: 3; font-family: var(--f-display); letter-spacing: .24em; text-transform: uppercase; font-size: .85rem; color: var(--chalk); text-shadow: 0 2px 12px #000, 0 0 6px rgba(0, 0, 0, .9); white-space: nowrap; pointer-events: none; }
    .hint b { color: var(--ochre); font-weight: 700; }
    #begin { display: grid; place-items: center; background: #000; }
    .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .fx .paper { position: absolute; inset: 0; z-index: 40; background: url(img/paper.jpg) center/cover; mix-blend-mode: soft-light; opacity: .6; }
    .fx .grain { position: absolute; inset: -120px; z-index: 40; background: url(img/grain.png); mix-blend-mode: overlay; opacity: .18; animation: grain .5s steps(1) infinite; }
    @keyframes grain { 0% { transform: translate(0,0); } 17% { transform: translate(-37px,22px); } 33% { transform: translate(29px,-41px); } 50% { transform: translate(-18px,-9px); } 67% { transform: translate(44px,31px); } 83% { transform: translate(-50px,48px); } 100% { transform: translate(12px,-26px); } }
    @media (max-height:500px) and (orientation:landscape) {
      .top { top: calc(4px + env(safe-area-inset-top, 0px)); }
      .top .ghost { padding: 5px 9px; font-size: .62rem; }
      .ctl { padding-top: 4px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
      .play { width: 30px; height: 30px; }
    }
    @media (max-width:640px) { .ghost { padding: 7px 10px; font-size: .68rem; } #fs { display: none !important; } }
    @media (max-width:600px) { .hint { font-size: .72rem; } }
    @media (hover:none), (pointer:coarse) { .fx { display: none; } }
    @media (prefers-reduced-motion:reduce) { .fx .grain, .zoom { animation: none; } .sil { opacity: .28 !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="stage">
    <section class="screen" id="intro">
      <div id="introFrame">
        <video id="iv" width="1280" height="720" playsinline webkit-playsinline preload="auto" disablepictureinpicture src="../vid/intro.mp4"></video>
        <div class="big" aria-live="polite"><span id="introBig"></span></div>
      </div>

      <div class="top" id="topBar">
        <a class="ghost home-link" href="../index.html" data-i18n="common.backHome">← Home</a>
        <span class="tools">
          <span id="stageLang"></span>
          <button class="ghost" id="skip" type="button" data-i18n="common.skip">Skip ›</button>
          <button class="ghost" id="fs" type="button" hidden data-i18n="common.fullScreen">⛶ Full screen</button>
        </span>
      </div>

      <div class="ctl" id="ctl">
        <button class="play" id="play" type="button" aria-label="Pause">❚❚</button>
        <div class="tl" id="tl">
          <div class="rail"></div>
          <div class="fill" id="fill"></div>
        </div>
        <span class="time" id="time">0:00 / 1:12</span>
        <button class="cc" id="cc" type="button" aria-pressed="true" aria-label="Subtitles" data-i18n-aria="common.ccLabel" hidden>
          <svg viewBox="0 0 32 24" aria-hidden="true">
            <rect x="2" y="2" width="28" height="20" rx="2.8" fill="none" stroke="currentColor" stroke-width="2.4"/>
            <rect x="6" y="14.8" width="6.6" height="1.85" rx=".35" fill="currentColor"/>
            <rect x="14.4" y="14.8" width="3.2" height="1.85" rx=".35" fill="currentColor"/>
            <rect x="19.4" y="14.8" width="6.6" height="1.85" rx=".35" fill="currentColor"/>
            <rect x="8.8" y="17.6" width="5.8" height="1.85" rx=".35" fill="currentColor"/>
            <rect x="17.4" y="17.6" width="5.8" height="1.85" rx=".35" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="screen off" id="scene">
      <div class="wrap" id="wrap">
        <div class="zoom">
          <img class="bgimg" src="img/reflect.jpg" width="1920" height="1080" alt="Grown-up Sam looks out of an airport window and sees his seventeen-year-old self reflected in the glass, with the control tower and a plane behind." data-i18n-alt="intro.reflectAlt">
          <img class="sil" src="img/young-silhouette.png" width="1920" height="1080" alt="">
        </div>
        <button id="young" type="button" aria-label="Click young Sam to begin the story" data-i18n-aria="intro.youngAria"></button>
        <div class="hint" data-i18n-html="intro.windowHint">Click <b>young Sam</b> to begin</div>
      </div>
    </section>

    <section class="screen off" id="begin"></section>
    <div class="fx" aria-hidden="true"><i class="paper"></i><i class="grain"></i></div>
  </div>

  <script src="../room/shared/progress-reset.js"></script>
  <script src="../i18n/i18n.js"></script>
  <script src="intro-shared.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const iv = $("iv"), introFrame = $("introFrame"), wr = $("wrap"), yb = $("young"), ccBtn = $("cc"), bigEl = $("introBig");
    const stageEl = document.querySelector(".stage");
    const flicker = WABTSA_INTRO_SHARED.createReflectionFlicker(document.querySelector("#scene .sil"), wr);
    const ambience = WABTSA_INTRO_SHARED.createTerminalAmbience();
    let running = false, lastCue = -1, windowToken = 0, enteringRoom = false;

    if (window.WABTSA_I18N) {
      WABTSA_I18N.mountSwitcher($("stageLang"));
    }

    function fitSceneWrap() {
      const sw = stageEl.clientWidth || window.innerWidth || 1;
      const sh = stageEl.clientHeight || window.innerHeight || 1;
      let w = sw, h = sw * 9 / 16;
      if (h > sh) { h = sh; w = sh * 16 / 9; }
      const wf = Math.floor(w) + "px", hf = Math.floor(h) + "px";
      wr.style.width = wf; wr.style.height = hf;
      if (introFrame) { introFrame.style.width = wf; introFrame.style.height = hf; }
    }
    window.addEventListener("resize", fitSceneWrap);
    window.addEventListener("orientationchange", () => setTimeout(fitSceneWrap, 150));
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fitSceneWrap);
    fitSceneWrap();

    function show(n, instant = false) {
      if (instant) stageEl.classList.add("instant");
      ["intro", "scene", "begin"].forEach(s => $(s).classList.toggle("off", s !== n));
      if (instant) { void stageEl.offsetHeight; stageEl.classList.remove("instant"); }
    }

    function fmt(t) {
      t = Math.max(0, Math.floor(t || 0));
      return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
    }

    function setPlaying(p) {
      $("play").textContent = p ? "❚❚" : "▶";
      const lbl = window.WABTSA_I18N ? WABTSA_I18N.t(p ? "common.pause" : "common.play") : (p ? "Pause" : "Play");
      $("play").setAttribute("aria-label", lbl);
    }

    function syncIntroSubtitles() {
      if (!window.WABTSA_I18N || !ccBtn || !bigEl) return;
      const allowed = WABTSA_I18N.isCcAllowed();
      const ccOn = WABTSA_I18N.getCcEnabled();
      ccBtn.hidden = !allowed;
      ccBtn.setAttribute("aria-pressed", ccOn ? "true" : "false");
      if (!allowed || !ccOn || !running || iv.ended) {
        bigEl.classList.remove("on");
        lastCue = -1;
        return;
      }
      const list = WABTSA_I18N.cues("intro");
      const cur = iv.currentTime || 0;
      const i = list.findIndex(c => cur >= c[0] && cur < c[1]);
      if (i !== lastCue) {
        lastCue = i;
        if (i >= 0) bigEl.textContent = list[i][2];
      }
      bigEl.classList.toggle("on", i >= 0);
    }

    if (ccBtn) {
      ccBtn.addEventListener("click", () => {
        if (window.WABTSA_I18N) WABTSA_I18N.toggleCc();
        syncIntroSubtitles();
        showControls();
      });
    }

    function tick() {
      if (!running) return;
      const dur = iv.duration || 72, cur = iv.currentTime || 0;
      $("fill").style.width = Math.min(100, cur / dur * 100) + "%";
      $("time").textContent = `${fmt(cur)} / ${fmt(dur)}`;
      syncIntroSubtitles();
      requestAnimationFrame(tick);
    }

    let ctlTimer = null, lastPaneTap = 0;
    function hideControls() { clearTimeout(ctlTimer); ctlTimer = null; document.body.classList.remove("show-ctl"); }
    function showControls() {
      if (!running || $("intro").classList.contains("off")) return;
      document.body.classList.add("show-ctl");
      clearTimeout(ctlTimer);
      if (!iv.paused) ctlTimer = setTimeout(hideControls, 3000);
    }
    (() => {
      const introEl = $("intro");
      function paneTap(e) {
        if (!running || introEl.classList.contains("off")) return;
        if (e.target.closest(".ctl,.top,button,a")) return;
        const now = Date.now(); if (now - lastPaneTap < 420) return; lastPaneTap = now;
        if (iv.paused) { $("play").click(); return; }
        if (document.body.classList.contains("show-ctl")) hideControls(); else showControls();
      }
      introEl.addEventListener("pointerup", e => { if (e.pointerType === "mouse" && e.button !== 0) return; paneTap(e); });
      introEl.addEventListener("click", paneTap);
      document.querySelectorAll(".ctl,.top").forEach(bar => {
        bar.addEventListener("pointerdown", () => { if (document.body.classList.contains("show-ctl")) showControls(); });
        bar.addEventListener("click", () => { if (document.body.classList.contains("show-ctl")) showControls(); });
      });
      addEventListener("keydown", e => {
        if (e.code === "Space" && running && !introEl.classList.contains("off")) {
          e.preventDefault(); $("play").click(); showControls();
        }
      });
    })();

    (() => {
      const tl = $("tl"); let dragging = false;
      function seek(e) {
        const r = tl.getBoundingClientRect(); if (!r.width) return;
        const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        const dur = iv.duration || 72;
        try { iv.currentTime = pct * dur; } catch (_) {}
        $("fill").style.width = (pct * 100) + "%";
        $("time").textContent = `${fmt(pct * dur)} / ${fmt(dur)}`;
        lastCue = -1; syncIntroSubtitles(); showControls();
      }
      tl.addEventListener("pointerdown", e => { dragging = true; try { tl.setPointerCapture(e.pointerId); } catch (_) {} seek(e); });
      tl.addEventListener("pointermove", e => { if (dragging) seek(e); });
      tl.addEventListener("pointerup", () => { dragging = false; });
      tl.addEventListener("pointercancel", () => { dragging = false; });
    })();

    let updFsLabel = () => {};
    (() => {
      const IS_NATIVE_APP = !!((window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || location.protocol === "capacitor:" || /; wv\)/.test(navigator.userAgent));
      const b = $("fs"); if (!b || IS_NATIVE_APP) return;
      const d = document, el = d.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen, ext = d.exitFullscreen || d.webkitExitFullscreen;
      if (!(d.fullscreenEnabled || d.webkitFullscreenEnabled) || !req) return;
      b.hidden = false;
      const isFs = () => d.fullscreenElement || d.webkitFullscreenElement;
      updFsLabel = () => {
        const key = isFs() ? "common.exitFullScreen" : "common.fullScreen";
        b.textContent = window.WABTSA_I18N ? WABTSA_I18N.t(key) : (isFs() ? "✕ Exit full screen" : "⛶ Full screen");
      };
      b.addEventListener("click", () => {
        try {
          if (isFs()) ext.call(d);
          else { const p = req.call(el); if (p && p.catch) p.catch(() => {}); try { const o = screen.orientation; if (o && o.lock) o.lock("landscape").catch(() => {}); } catch (_) {} }
        } catch (_) {}
      });
      d.addEventListener("fullscreenchange", updFsLabel);
      d.addEventListener("webkitfullscreenchange", updFsLabel);
      updFsLabel();
    })();

    if (window.WABTSA_I18N) {
      WABTSA_I18N.onChange(() => { lastCue = -1; setPlaying(!iv.paused); syncIntroSubtitles(); updFsLabel(); });
    }

    let introWatchdog = null;
    function clearIntroWatchdog() { clearTimeout(introWatchdog); introWatchdog = null; }
    function stopIntro() {
      running = false; clearIntroWatchdog(); hideControls(); iv.pause(); iv.classList.remove("on");
      if (bigEl) bigEl.classList.remove("on");
      flicker.stop();
    }

    let prefetched = false;
    function prefetchRoom() {
      if (prefetched) return; prefetched = true;
      ["../room/index.html", "../room/shared/shared.css", "../room/shared/lib/three.min.js", "../room/shared/fsm.js", "../room/shared/shared.js", "../room/app.js", "../room/assets/room.jpg"].forEach(href => {
        const l = document.createElement("link"); l.rel = "prefetch"; l.href = href; document.head.appendChild(l);
      });
    }

    const sceneImgsReady = Promise.all([...document.querySelectorAll("#scene img")].map(img => new Promise(res => {
      if (img.complete) return res();
      const done = () => { img.removeEventListener("load", done); img.removeEventListener("error", done); res(); };
      img.addEventListener("load", done); img.addEventListener("error", done);
    }).then(() => img.decode ? img.decode().catch(() => {}) : undefined)));

    function startIntro() {
      flicker.stop(); ambience.stop();
      running = true; lastCue = -1;
      show("intro", true); fitSceneWrap(); syncIntroSubtitles();
      iv.classList.remove("on");
      try { iv.currentTime = 0; } catch (_) {}
      iv.muted = false; iv.volume = 1;
      clearIntroWatchdog();
      introWatchdog = setTimeout(() => { if (running && iv.paused && iv.readyState < 2) toWindow(); }, 10000);
      iv.play().then(() => setPlaying(true)).catch(() => {
        iv.muted = true;
        iv.play().then(() => setPlaying(true)).catch(() => { clearIntroWatchdog(); iv.classList.add("on"); setPlaying(false); showControls(); });
      });
      requestAnimationFrame(tick);
    }

    function toWindow(fromHistory = false) {
      const token = ++windowToken;
      stopIntro();
      wr.classList.remove("chosen");
      Promise.race([sceneImgsReady, new Promise(r => setTimeout(r, 250))]).then(() => {
        if (token !== windowToken) return;
        requestAnimationFrame(() => {
          if (token !== windowToken) return;
          fitSceneWrap();
          show("scene");
          flicker.start();
          ambience.start();
          prefetchRoom();
          if (!fromHistory && location.hash !== "#window") {
            try { history.pushState({ wabtsa: "intro", screen: "window" }, "", location.pathname + location.search + "#window"); } catch (_) {}
          }
        });
      });
    }

    iv.addEventListener("loadeddata", () => { if (running) iv.classList.add("on"); });
    iv.addEventListener("canplay", () => { if (running) iv.classList.add("on"); });
    iv.addEventListener("timeupdate", () => { if (iv.currentTime > 0) { iv.classList.add("on"); clearIntroWatchdog(); } syncIntroSubtitles(); });
    iv.addEventListener("playing", () => { iv.classList.add("on"); clearIntroWatchdog(); setPlaying(true); if (document.body.classList.contains("show-ctl")) showControls(); });
    iv.addEventListener("pause", () => { if (!iv.ended) { setPlaying(false); showControls(); } });
    iv.addEventListener("error", () => { if (running) toWindow(); });
    iv.onended = () => { if (running) toWindow(); };

    ["pointerdown", "touchstart", "keydown", "click"].forEach(ev => {
      document.addEventListener(ev, () => {
        ambience.unlock();
        if (running && iv.muted && !iv.paused) { iv.muted = false; iv.volume = 1; }
      }, { passive: true });
    });

    $("play").onclick = () => {
      ambience.unlock();
      if (iv.paused) { iv.muted = false; iv.volume = 1; iv.play().then(() => setPlaying(true)).catch(() => {}); }
      else { iv.pause(); setPlaying(false); }
      showControls();
    };
    $("skip").onclick = () => toWindow(false);

    function afterYoungSam() {
      if (enteringRoom) return; enteringRoom = true;
      if (location.hash !== "#window") {
        try { history.replaceState({ wabtsa: "intro", screen: "window" }, "", location.pathname + location.search + "#window"); } catch (_) {}
      }
      show("begin");
      setTimeout(() => { location.href = "../room/index.html" + (location.search || ""); }, 1050);
    }
    yb.onclick = () => {
      if (enteringRoom) return;
      ambience.unlock();
      wr.classList.add("chosen");
      flicker.choose();
      ambience.stop();
      setTimeout(afterYoungSam, 450);
    };

    if (location.search) {
      document.querySelectorAll(".home-link").forEach(a => { a.href = "../index.html" + location.search; });
    }

    window.addEventListener("popstate", () => {
      enteringRoom = false; wr.classList.remove("chosen");
      if (location.hash === "#window") toWindow(true);
      else { ++windowToken; startIntro(); }
    });
    window.addEventListener("pageshow", () => {
      enteringRoom = false; wr.classList.remove("chosen");
      if (location.hash === "#window") toWindow(true);
    });

    if (location.hash === "#window") toWindow(true);
    else startIntro();
  </script>
</body>
</html>
