<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000">
<title>Zolderkamer</title>
<link rel="stylesheet" href="../shared/shared.css">
</head>
<body>
<!-- Variatie 2 · De zolderkamer.
     De kamer uit de briefing: de tienerkamer bij het pleeggezin, waar Sam uiteindelijk terechtkomt (zie Room.png).
     Echte 3D, toon-shaded, met een eigen nabewerking: bevende stiftlijnen (diepte + normalen), arcering in de schaduw,
     papierkorrel en een kleurvlak dat net naast de lijn valt, zoals bij stift over inkt.
     Vier dingen in de kamer openen de vier hoofdstukken. Na elk hoofdstuk schuift de tijd op: avond → nacht → dageraad → ochtend,
     en hangt er een getekende pagina meer aan de muur. -->
<canvas class="gl" id="gl"></canvas>
<div class="ld-card off" id="start">
  <div>
    <p class="eye">We All Breathe The Same Air · de kamer</p>
    <h1>Zolder&shy;kamer</h1>
    <p>Een gewone kamer, ergens in Nederland. Het is avond. Hoe kwam Sam hier terecht?</p>
    <button class="btn" id="go" type="button">Kijk rond</button>
  </div>
</div>
<div class="ld-card light off" id="end">
  <div>
    <p class="eye">Het is ochtend</p>
    <h1>Hoe kwam ik<br>hier terecht?</h1>
    <p>Het verhaal van Sam gaat verder in deel 3.</p>
    <button class="btn" id="again" type="button">Blijf in de kamer</button>
  </div>
</div>
<script src="../shared/lib/three.min.js"></script>
<script src="../shared/shared.js"></script>
<script src="app.js"></script>
</body></html>
